<!DOCTYPE html>
<!-- prompt surface (see src/core/surfaces/ui.ts). In: ITEMS_PLACEHOLDER = PaletteItem[], INITIAL_PLACEHOLDER = null | { text, cursor } (prefilled input and caret position). COMPLETION_PLACEHOLDER = null | the CmdComplete snapshot. Out (close_and_send): JSON PaletteResult, or '' when dismissed. HELP_PLACEHOLDER = null | boolean (ui.helpLine; null = on; false = the footer shows the keys only, otherwise it explains the command and the argument at the caret). While the line is exactly one bare word that has an entry in COMPLETION.defaults (plan 0019 §7), one dim row "word → line" sits above the list: Enter sends the typed word (core expands it), Tab or a click writes the expanded line into the prompt. One list below the prompt (recent lines, targets; options after typing `-`; subcommands at a group position); nothing sits above the prompt. The highlighted row's description, when cut off, scrolls slowly (marquee; not with prefers-reduced-motion). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <title>cmdAbl</title>
  <style>
    /*SHARED_CSS_PLACEHOLDER*/

    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    /* ── input bar ── */
    #bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #colon {
      color: var(--accent);
      font-size: 15px;
      font-weight: 700;
      user-select: none;
    }

    #field { flex: 1; position: relative; display: flex; min-width: 0; }

    /* Ghost hint for the next option value ("<old>"): a mirror of the typed text (invisible) with the hint after it. */
    #ghost {
      position: absolute; left: 0; top: 0; bottom: 0; right: 0;
      display: flex; align-items: center; overflow: hidden;
      white-space: pre; pointer-events: none;
    }
    #ghost .mirror { visibility: hidden; }
    #ghost .hint { color: var(--dim); }

    #input {
      width: 100%;
      padding: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font: inherit;
      caret-color: var(--accent);
    }

    /* ── footer ── */
    /* The footer is always there with a fixed height (room for three 14px text lines, or one text line and a key-cap line: 42px, + 4px padding above and below = 50px, plus the
       1px border), so the prompt and the rows never move whatever the help says. */
    #foot { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 4px 12px; border-top: 1px solid var(--border); color: var(--dim); font-size: 11px; user-select: none; }
    #hint { flex: 1 1 0; min-width: 0; height: 42px; overflow: hidden; line-height: 14px; }
    #hint > div { line-height: 14px; }
    #hint.keys > div { display: block; }

    /* ── dropdown (Set zone, below the prompt) ── */
    #dropdown { flex: 1; overflow-y: auto; }

    .row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 6px 12px;
      cursor: default;
    }

    .row.active { background: var(--bg-row); }
    .row.exp { cursor: pointer; }
    .row.exp .label { color: var(--dim); font-weight: 400; }
    .row.exp .desc { opacity: .75; }
    .row.active .label { color: var(--accent); }

    /* One line per row: the title keeps its width up to the row, the grey text gives way first. */
    .label { flex: 0 1 auto; min-width: 90px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .desc  { flex: 1 1 0; min-width: 0; color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* The highlighted row's cut-off description scrolls: an inner span the marquee moves; the fade replaces the "…" while it does. */
    .desc .dt { display: inline-block; white-space: nowrap; }
    .desc.marq { text-overflow: clip; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 18px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 18px), transparent); }
  </style>
</head>
<body>

  <div id="bar">
    <span id="colon">:</span>
    <div id="field">
      <input id="input" type="text" autocomplete="off" spellcheck="false" />
      <div id="ghost" aria-hidden="true"><span class="mirror"></span><span class="hint"></span></div>
    </div>
  </div>

  <div id="dropdown"></div>

  <div id="foot"><div id="hint"></div></div>

  <!-- Shared matcher, inlined as a `CmdMatch` global at build time. -->
  <script>/*MATCH_PLACEHOLDER*/</script>
  <!-- Help line (plan 0019 §3), inlined as the `help` global at build time. -->
  <script>/*HELP_JS_PLACEHOLDER*/</script>
  <script>/*LISTNAV_JS_PLACEHOLDER*/</script>

  <script>
    // Injected by the extension before the dialog opens. PaletteItem[]:
    //   { id, type, title, subtitle?, keywords?, path? }
    const ITEMS = /*ITEMS_PLACEHOLDER*/null;
    // null, or { text, cursor }: the input starts with `text` and the caret at `cursor`
    // (0 = start), e.g. a path put in the prompt from a pick list.
    const INITIAL = /*INITIAL_PLACEHOLDER*/null;
    // null, or the snapshot CmdComplete.complete(line, cursor, COMPLETION) works on:
    //   { tree, completions, paths, tags }. null = no argument completion.
    const COMPLETION = /*COMPLETION_PLACEHOLDER*/null;
    // null, or true/false: the request's `help` (ui.helpLine). null counts as on. false = the footer shows the palette's keys only.
    const HELP = /*HELP_PLACEHOLDER*/null;

    const input     = document.getElementById('input');
    const dropdown  = document.getElementById('dropdown');
    const ghostMirror = document.querySelector('#ghost .mirror');
    const ghostHint   = document.querySelector('#ghost .hint');

    const itemsById = Object.fromEntries(ITEMS.map(i => [i.id, i]));

    // 'path' lets a bare "/vermona/kick"-style query fuzzy-match a Live
    // object's address directly, on top of matching its bare name.
    const itemRank = CmdMatch.ranker(ITEMS, ['title', 'subtitle', 'keywords', 'path']);

    let items     = [];   // current completion candidates
    let activeIdx = 0;
    let chainCmds = null;  // command rows (no Live objects) for the parts of a `;` chain, built on first use
    let newLine   = null;  // rows + ranker without history lines, built on first use
    let chosen    = false; // the user moved the selection (arrows, Tab) since the last keystroke
    let mode      = 'word0'; // 'word0': fuzzy rows for the first word; 'args': CmdComplete rows
    let dashed    = false;  // the word at the caret starts with `-`: the options are the list
    let view      = null;    // args mode: { replace: {from, to}, usage }
    let segView   = null;    // the `;` part the caret is in ({ start, end }), null when the line is no chain

    // ── messaging ──────────────────────────────────────────────────────────
    // Returns a structured PaletteResult to the host as a JSON string (the
    // bridge can only carry one string); null/empty closes without acting.
    function send(result) {
      const payload = result == null ? '' : JSON.stringify(result);
      sendRaw(payload);
    }
    function sendRaw(payload) {
      const msg = { method: 'close_and_send', params: [payload] };
      if (window.webkit?.messageHandlers?.live) {
        window.webkit.messageHandlers.live.postMessage(msg);
      } else if (window.chrome?.webview) {
        window.chrome.webview.postMessage(msg);
      } else window.__sent = payload;   // plain browser: for checking with sample data
    }

    // ── mode: first word (fuzzy) or arguments (CmdComplete) ────────────────
    // Once the caret is past a registered command's name, CmdComplete.complete() decides
    // what is offered at that position (options, values, paths, tags). Before that — and
    // for a first word that is no command name, e.g. a track called "Opal Lead" — the
    // palette ranks commands, history and Live objects as before.
    // A leading `\` on the first word is the "no default" escape (plan 0019 §7): completion reads `\mute` as `mute`.
    const unesc = w => w.startsWith('\\') ? w.slice(1) : w;
    // A command row taken over a first word that starts with `\` keeps the escape: `\mu` + Tab gives `\mute `.
    const escKept = (item, text = input.value) => text.trimStart().startsWith('\\') && !item.id.includes(' ') ? '\\' : '';
    function modeAt(raw, caret) {
      const m = /^\s*(\S+)/.exec(raw);
      if (!m || itemsById[unesc(m[1])]?.type !== 'command') return 'word0';
      const end = m[0].length;
      return raw.length > end && /\s/.test(raw[end]) && caret > end ? 'args' : 'word0';
    }

    // A line like ` "/path"` (a path put in the prompt) leaves the caret in front of
    // a space-led rest: the user types the command there. Only the word before the
    // caret is then ranked and completed; the rest stays untouched.
    function wordAtCaret(v = input.value, caret = input.selectionStart ?? v.length) {
      const head = v.slice(0, caret), tail = v.slice(caret);
      return !head.includes(' ') && tail.startsWith(' ') ? { head, tail } : null;
    }

    // ── `;` chains (plan 0017) ─────────────────────────────────────────────
    // The part of the line the caret is in is its own line: it gets the word-0 rows or the argument
    // completion by itself. null when the line is no chain. The split is core's (CmdComplete.chainSegments),
    // so `;` in quotes is no separator here either.
    function segmentAt(raw, caret) {
      const segs = CmdComplete.chainSegments ? CmdComplete.chainSegments(raw) : [];
      if (segs.length < 2) return null;
      return segs.find(g => g.start <= caret && caret <= g.end) ?? segs[segs.length - 1];
    }

    // ── build completion list ──────────────────────────────────────────────
    function computeItems(raw) {
      const caretAll = input.selectionStart ?? raw.length;
      segView = segmentAt(raw, caretAll);
      const caret = caretAll;
      // Word-0 ranking works on the part's own text; the argument completion gets the whole line (core
      // completes the part the caret is in and returns offsets into the whole line).
      const segRaw = segView ? raw.slice(segView.start, segView.end) : raw;
      const segCaret = caretAll - (segView ? segView.start : 0);
      mode = modeAt(segRaw, segCaret);
      view = null;
      dashed = false;
      if (mode === 'args') {
        if (!COMPLETION) return [];
        const res = CmdComplete.complete(raw, caret, COMPLETION);
        view = { replace: res.replace, usage: res.usage ?? null, help: res.help ?? null };
        const rows = res.items.map(r => ({ type: r.kind, zone: r.zone, title: r.label, subtitle: r.description, insert: r.insert }));
        const tool = rows.filter(r => r.zone === 'tool'), set = rows.filter(r => r.zone !== 'tool');
        const hist = recentLines(raw, caret);
        // The list holds targets (recent lines first). Options join it only once `-` is typed, and
        // subcommands at a group position with no targets.
        dashed = raw.slice(res.replace.from, caret).startsWith('-');
        const toolInList = dashed || (!set.length && tool[0]?.type === 'command');
        // The command rows of the tool zone (the `config` row) stay offered after the targets.
        return [...hist, ...set, ...(toolInList ? tool : tool.filter(r => r.type === 'command'))];
      }
      const part = wordAtCaret(segRaw, segCaret);
      // The word before the caret is a complete command name: its arguments follow, no completion.
      if (part && itemsById[unesc(part.head)]?.type === 'command') return [];
      const query = unesc((part ? part.head : segRaw).trim());
      // The first word is a command and text follows it: arguments, caret in the name — nothing to rank.
      if (!part && /^\s*\S+\s/.test(segRaw) && itemsById[unesc(segRaw.trim().split(/\s/)[0])]?.type === 'command') return [];
      // Around a path put in the prompt the user builds a new line: a stored full
      // invocation (history row) would run on an old target and drop that path.
      if (part && !newLine) newLine = (() => {
        const rows = ITEMS.filter(i => !(i.type === 'command' && i.id.includes(' ')));
        return { rows, rank: CmdMatch.ranker(rows, ['title', 'subtitle', 'keywords', 'path']) };
      })();
      // In a chain a part is a command line: only command rows (and stored lines) are offered. A Live-object
      // row would put a bare path where a command belongs (outside a chain the host turns it into `goto`).
      // A leading `\` on the first word restricts the rows to commands: no objects, tags or stored lines.
      const esc = segRaw.trimStart().startsWith('\\');
      if ((segView || esc) && !chainCmds) {
        const mk = rows => ({ rows, rank: CmdMatch.ranker(rows, ['title', 'subtitle', 'keywords', 'path']) });
        const cmds = ITEMS.filter(i => i.type === 'command');
        chainCmds = { all: mk(cmds), plain: mk(cmds.filter(i => !i.id.includes(' '))) };   // `plain`: without stored lines
      }
      const src = segView || esc ? (part || esc ? chainCmds.plain : chainCmds.all) : part ? newLine : { rows: ITEMS, rank: itemRank };
      const rows = src.rows, rank = src.rank;

      if (!query) return zoned(rows);

      // Drop "canned full invocation" items (command-type, multi-word id —
      // e.g. a history entry "mute A, B") that the user has already typed
      // past — e.g. typing "mute A, B, C" after running "mute A, B" would
      // otherwise leave the shorter, stale row fuzzy-matched and active, so
      // Enter would silently run the old invocation instead of the new one.
      // Forward-completable matches (entry.startsWith(query)) stay.
      return zoned(rank(query).filter(item =>
        !(item.type === 'command' && item.id.includes(' ')
          && query.length > item.id.length && query.startsWith(item.id))));
    }

    // Word 0: one list below the prompt in ranking order (index 0 is the best row overall, the
    // default highlight); `zone` only records the kind of row.
    function zoned(rows) {
      return rows.map(i => i.zone ? i : Object.assign({}, i, { zone: i.type === 'command' && !i.id.includes(' ') ? 'tool' : 'set' }));
    }

    // Arguments: stored lines that start with what is typed lead the Set zone (newest first, at most 3).
    function recentLines(raw, caret) {
      if (caret !== raw.length || segView) return [];   // a stored line would replace the whole chain
      const typed = raw.trimStart().toLowerCase();
      return ITEMS.filter(i => i.type === 'command' && i.id.includes(' ') && i.id.length > typed.length && i.id.toLowerCase().startsWith(typed))
        .slice(0, 3).map(i => ({ type: 'history', zone: 'set', title: i.id, subtitle: 'recent', line: i.id }));
    }

    // The highlight with nothing chosen: the best word-0 row; in arguments the first target (path,
    // tag or value; recent lines stay one ↑ above it), at a group position the best subcommand
    // (`pakabl ` + Tab), and after a typed `-` the first option. -1 = none.
    function defaultIdx() {
      if (mode !== 'args') return 0;
      const t = items.findIndex(r => r.zone === 'set' && r.type !== 'history');
      if (t !== -1) return t;
      return items.findIndex(r => r.type === 'command' || (dashed && r.type === 'option'));
    }

    // Rows top to bottom as drawn: the list order.
    function displayOrder() { return items.map((_, i) => i); }

    // Take a word-0 row inside a `;` chain: it replaces the part's first word (or the whole part) and
    // leaves the rest of the chain alone. `descend` adds the space after a command, like Tab does.
    function applyWord0(item, descend) {
      const v = input.value, { start, end } = segView;
      const segText = v.slice(start, end);
      const caretSeg = Math.min(input.selectionStart ?? v.length, end) - start;
      const lead = segText.length - segText.trimStart().length;
      const part = wordAtCaret(segText, caretSeg);
      const from = start + lead;
      const word = item.type === 'command' ? escKept(item, segText) + item.id : (item.path ?? item.title);
      let to, text = word;
      if (part) to = start + caretSeg;   // the caret ends the first word: its tail stays
      else { to = end; if (descend && item.type === 'command' && !item.id.includes(' ')) text += ' '; }
      input.value = v.slice(0, from) + text + v.slice(to);
      const at = from + text.length;
      input.setSelectionRange(at, at);
    }

    // Splice a completion row into the line (args mode). `descend` (Tab, click) adds the
    // space that starts the next word; Enter inserts as is and runs the line.
    function applyRow(item, descend) {
      const v = input.value;
      if (item.line !== undefined) {   // a stored line replaces the whole prompt
        input.value = item.line;
        input.setSelectionRange(item.line.length, item.line.length);
        return true;
      }
      // The rows belong to the caret position they were built for; a caret that moved some
      // other way (select all, a drag) must not make them splice over another word.
      const now = COMPLETION && CmdComplete.complete(v, input.selectionStart ?? v.length, COMPLETION).replace;
      if (!now || now.from !== view.replace.from || now.to !== view.replace.to) return false;
      const { from, to } = view.replace;
      const ins = item.insert ?? item.title;
      const after = v.slice(to);
      let text = v.slice(0, from) + ins, caret = text.length;
      if (descend && !/=$/.test(ins)) {
        if (/^\s/.test(after)) caret += 1;       // the space is already there
        else text += ' ', caret += 1;
      }
      input.value = text + after;
      input.setSelectionRange(caret, caret);
      return true;
    }

    // The first argument of the line's command is free text (kind text, no completer, no choices):
    // what is typed there is the user's own text, never a name to complete. The `config` row is the
    // first word after the command, so only that argument matters.
    function freeTextArg() {
      const v = segView ? input.value.slice(segView.start, segView.end) : input.value;
      const word = v.trim().replace(/^\\/, '').split(/\s/)[0];
      const node = COMPLETION?.tree.find(n => n.name === word || (n.aliases || []).includes(word));
      const arg = node && !node.children?.length && node.args?.[0];
      return !!arg && arg.kind === 'text' && !arg.complete && !arg.choices;
    }

    // ── structured payload for a chosen item ────────────────────────────────
    function resultFor(item) {
      // A "canned full invocation" (command-type, multi-word id — e.g. a
      // history entry "mute A, B"): split it exactly like raw typed input
      // (rawResult, below) so it runs through the very same {id, line} path
      // a fresh invocation would — the host never needs to know it came from
      // a stored entry rather than the keyboard.
      // A command row taken while text follows the caret (a path put in the
      // prompt) keeps that text: `mu` + Enter on `mute` runs `mute "<path>"`.
      const part = wordAtCaret();
      if (item.type === 'command' && !item.id.includes(' ') && input.value.trimStart().startsWith('\\') && !part) {
        return { type: 'command', id: item.id, line: '\\' + item.id };   // the escape reaches core: no default
      }
      if (item.type === 'command' && !item.id.includes(' ') && part) {
        return { type: 'command', id: item.id, line: item.id + part.tail };
      }
      if (item.type === 'command' && item.id.includes(' ')) {
        const sp = item.id.indexOf(' ');
        return { type: 'command', id: item.id.slice(0, sp), line: item.id };
      }
      // A command, or a Live object row (track, device, chain, …): the host
      // runs `goto <unique path>` for the latter.
      const result = { type: item.type, id: item.id };
      if (item.type === 'command') result.line = item.id;
      return result;
    }

    // Enter with a fuzzy command row active that the user did not choose: a
    // typed line whose first word is no command name ("unmute Kick") must reach
    // the platform as typed, so it answers "unknown command" — running the
    // nearest fuzzy row would run a different command than the one typed. A
    // lone prefix of the row's name ("mut") still completes to it, as does an
    // empty input (first row / history). Object rows are not affected: typing
    // part of a name and Enter selects that object.
    function typedLineWins(item) {
      const raw0 = input.value.trim();
      // `\…` means a command: Enter takes a command row the word is a prefix of (sent with the escape, see resultFor);
      // anything else (a device row, no match) goes to core as typed.
      if (raw0.startsWith('\\') && !chosen) return !(item.type === 'command' && !item.id.includes(' ') && raw0.length > 1 && !/\s/.test(raw0) && item.id.toLowerCase().startsWith(raw0.slice(1).toLowerCase()));
      if (chosen || item.type !== 'command') return false;
      const raw = raw0;
      if (!raw) return false;
      const part = wordAtCaret();
      // With text after the caret only the word before it is the candidate prefix.
      const word = part ? part.head : raw;
      if (part && !word) return true;
      if (!word.includes(' ') && item.id.toLowerCase().startsWith(word.toLowerCase())) return false;
      return true;
    }

    // ── structured payload for free-typed input (no active item) ─────────────
    function rawResult() {
      const raw = input.value.trim();
      if (!raw) return null;
      const sp = raw.indexOf(' ');
      // The host parses the raw line (quotes and all); `id` is just the first word.
      return { type: 'command', id: sp === -1 ? raw : raw.slice(0, sp), line: raw };
    }

    // ── ghost: the usage of this position, display only ────────────────────
    // CmdComplete's `usage` (`<old>`, `<command>`, `[<targets>…]`), shown behind the caret
    // when it is at the end of the line and the word at the caret is empty (right after a space).
    // The one owner of #ghost; it never affects Enter or Tab.
    function updateGhost() {
      let hint = null;
      const v = input.value;
      if (mode === 'args' && view?.usage && (input.selectionStart ?? v.length) === v.length && input.selectionEnd === v.length
          && view.replace.from === view.replace.to) {
        hint = (/\s$/.test(v) ? '' : ' ') + view.usage;
      }
      ghostMirror.textContent = hint ? v : '';
      ghostHint.textContent = hint ?? '';
      ghostMirror.style.marginLeft = hint ? -input.scrollLeft + 'px' : '0';
    }

    // The highlighted row's description, when cut off, scrolls sideways like a marquee: it starts after 700 ms on the
    // row, moves at 40 px/s (a transform on an inner span, so nothing reflows), waits 1 s at the end, jumps
    // back and goes again. Any render (another row, another key) stops it. Reduced motion: no scroll, the footer shows the full description.
    let marqueeTimer = null, marqueeAnim = null;
    function stopMarquee() {
      clearTimeout(marqueeTimer); marqueeTimer = null;
      if (marqueeAnim) { marqueeAnim.cancel(); marqueeAnim = null; }
    }
    function armMarquee() {
      stopMarquee();
      const hd = dropdown.querySelector('.row.active:not(.exp) .desc');
      const t = hd?.firstChild;
      if (!t || !t.animate) return;
      const dist = Math.ceil(t.offsetWidth - hd.clientWidth);
      if (dist <= 1) return;   // fits: nothing to read
      if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;   // reduced motion: no scrolling, no tooltip
      const travel = dist + 18;   // the end of the text clears the fade at the right edge
      hd.classList.add('marq');
      const run = () => {
        marqueeAnim = t.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(' + (-travel) + 'px)' }],
                                { duration: travel / 0.04, easing: 'linear', fill: 'forwards' });
        marqueeAnim.onfinish = () => {
          marqueeTimer = setTimeout(() => {   // 1 s at the end, then jump back and go again
            if (marqueeAnim) { marqueeAnim.cancel(); marqueeAnim = null; }
            marqueeTimer = setTimeout(run, 700);
          }, 1000);
        };
      };
      marqueeTimer = setTimeout(run, 700);
    }

    // ── default command (plan 0019 §7) ─────────────────────────────────────
    // While the whole line is one bare word that has a default, core expands it on Enter; the page only shows it.
    function expansion() {
      const word = input.value.trim();
      const map = COMPLETION?.defaults;
      if (!map || !word || /\s/.test(word) || segView || chosen || mode !== 'word0' || input.value !== word || !Object.prototype.hasOwnProperty.call(map, word)) return null;
      return { word, line: map[word] };
    }
    function useExpansion(exp) {
      input.value = exp.line;
      input.setSelectionRange(exp.line.length, exp.line.length);
      activeIdx = 0; chosen = false; render(); input.focus();
    }

    // ── render ─────────────────────────────────────────────────────────────
    function render() {
      items     = computeItems(input.value);
      activeIdx = chosen ? Math.min(activeIdx, items.length - 1) : defaultIdx();
      updateGhost();

      dropdown.innerHTML = '';

      const draw = (item, i) => {
        const row = document.createElement('div');
        row.className = 'row' + (i === activeIdx ? ' active' : '');
        // textContent, not innerHTML: item titles may be user data (track names).
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = item.title;
        const desc = document.createElement('span');
        desc.className = 'desc';
        if (i === activeIdx && item.subtitle) {   // the highlighted row: an inner span the marquee can move
          const t = document.createElement('span'); t.className = 'dt'; t.textContent = item.subtitle; desc.appendChild(t);
        } else desc.textContent = item.subtitle ?? '';
        row.append(label, desc);
        row.addEventListener('mousedown', e => {
          e.preventDefault();
          if (mode === 'args') { applyRow(item, true); activeIdx = 0; chosen = false; render(); input.focus(); }
          else if (segView) { applyWord0(item, true); activeIdx = 0; chosen = false; render(); input.focus(); }
          else send(resultFor(item));
        });
        return row;
      };

      // A bare word with a default command: one dim row above the list shows what Enter runs (Tab writes it into the prompt).
      const exp = expansion();
      if (exp) {
        const row = document.createElement('div'); row.className = 'row exp';
        const label = document.createElement('span'); label.className = 'label'; label.textContent = exp.word + ' → ' + exp.line;
        const desc = document.createElement('span'); desc.className = 'desc'; desc.textContent = 'default command · Enter runs it · Tab edits it · \\' + exp.word + ' skips it';
        row.append(label, desc);
        row.addEventListener('mousedown', e => { e.preventDefault(); useExpansion(exp); });
        dropdown.appendChild(row);
      }
      for (const i of displayOrder()) dropdown.appendChild(draw(items[i], i));
      armMarquee();

      document.querySelector('.row.active')?.scrollIntoView({ block: 'nearest' });
      help.update();
    }

    // ── help footer (plan 0019 §4) ─────────────────────────────────────────
    // Two lines, fixed height. Line 1: the command (or subcommand) and its summary; line 2: the argument at the caret, the option
    // waiting for its value, or (while typing `-`) the highlighted option. A highlighted suggestion row never changes it (user's
    // choice), except that option row. Empty prompt, unknown command, `help: false`: the palette's keys.
    // The data is core's `help` of the completion result: { command, summary, focus?: { label, text } }.
    const HELP_ON = HELP !== false;
    const KEYS = [['Tab', 'complete'], ['↑↓', 'choose'], ['Enter', 'run'], ['Esc', 'close']];
    function helpOverride() {
      const h = HELP_ON && mode === 'args' ? view?.help : null;
      if (!h || !h.command) return null;
      const cur = items[activeIdx];
      let l2 = '';
      if (dashed && cur && cur.type === 'option') {
        // The row's detail reads "-s  <value>  summary": the alias and the value name belong to the subject ("--set (-s) <value>: summary").
        let rest = cur.subtitle ?? '', subj = cur.title, m;
        if ((m = /^(-\w)\s+/.exec(rest))) { subj += ' (' + m[1] + ')'; rest = rest.slice(m[0].length); }
        if ((m = /^(<[^>]*>)\s+/.exec(rest))) { subj += ' ' + m[1]; rest = rest.slice(m[0].length); }
        l2 = subj + ': ' + rest;
      }
      else if (h.focus) l2 = h.focus.label + (h.focus.text ? ': ' + h.focus.text : '');
      return { lines: [h.command + ': ' + h.summary, l2 || KEYS] };   // nothing at the caret: the keys fill the reserved line
    }
    help.init(document.getElementById('hint'), { idle: () => KEYS, enabled: false, override: helpOverride });

    // ── keyboard ───────────────────────────────────────────────────────────
    input.addEventListener('input', () => { activeIdx = 0; chosen = false; render(); });

    input.addEventListener('click', () => { activeIdx = 0; chosen = false; render(); });   // a click moves the caret: rows follow it

    // Moving the caret can change which word is completed.
    input.addEventListener('keyup', e => {
      if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) { activeIdx = 0; chosen = false; render(); }
    });

    // ↑/↓ walk the rows as drawn; the ends stop.
    function moveSel(d) {
      const order = displayOrder();
      if (!order.length) return;
      if (activeIdx < 0) {   // nothing highlighted: ↑ goes to the last row, ↓ to the first
        activeIdx = d < 0 ? order[order.length - 1] : order[0]; chosen = true; render();
        return;
      }
      activeIdx = order[Math.max(0, Math.min(order.indexOf(activeIdx) + d, order.length - 1))];
      chosen = true;
      render();
    }

    // Keys go through ui/listnav.js (plan 0019 §5), as a bare list: the rows are always live, the input keeps the caret keys.
    // Tab only completes; it never marks or runs.
    const nav = CmdListNav.create();
    input.addEventListener('keydown', e => {
      const act = nav.action(e, { zone: 'field', bare: true, canComplete: true });
      if (act === 'none') e.preventDefault();   // Shift+Tab: nothing to focus
      if (act === 'close') {
        e.preventDefault();
        send(null);
      } else if (act === 'take') {
        e.preventDefault();
        const item = items[activeIdx];
        if (mode === 'args') {
          // The typed line runs; a row only when the user moved the selection to it. Exception: a
          // highlighted tool-zone command row (`config`, a subcommand) whose name the word at the caret
          // is a non-empty prefix of (`goto con` → `config`): it names what the line means. An empty
          // word (`play ` + Enter) or a substring match (`goto on`) never takes it, and neither does
          // a free-text first argument (`find con` searches for "con"; Tab still completes to `config`).
          const typed = view ? input.value.slice(view.replace.from, input.selectionStart ?? input.value.length) : '';
          const prefixOfRow = item && item.type === 'command' && item.zone === 'tool' && typed !== ''
            && String(item.insert ?? item.title).toLowerCase().startsWith(typed.toLowerCase())
            && !freeTextArg();
          if (item && (chosen || prefixOfRow)) applyRow(item, false);
          const result = rawResult();
          if (result) send(result);
          return;
        }
        if (segView) {   // a chain runs as a whole: a row only when the user chose it
          if (item && chosen) applyWord0(item, false);
          const result = rawResult();
          if (result) send(result);
          return;
        }
        const result = item && !typedLineWins(item) ? resultFor(item) : rawResult();
        if (result) send(result);
      } else if (act === 'complete') {
        e.preventDefault();
        const exp = expansion();
        if (exp) { useExpansion(exp); return; }
        const item = items[activeIdx];
        if (!item) return;
        if (mode === 'args') {
          applyRow(item, true);   // take the row and descend
          activeIdx = 0;
          chosen = false;         // the next position's top row is not chosen
          render();
          return;
        }
        if (segView) {   // inside a chain: replace the part's word, keep the rest
          applyWord0(item, true);
          activeIdx = 0;
          chosen = true;
          render();
          if (mode === 'args') { chosen = false; render(); }
          return;
        }
        // Tab only autocompletes the highlighted item into the input — it never
        // executes. The user commits with Enter (and can edit first).
        // Commands get a trailing space so you land in their arguments. Live
        // objects fill their *path*, not their bare name — names collide
        // constantly (multiple devices/tracks called "DefaultTracks", "EQ
        // Eight", …), so completing to the name would just re-match every
        // same-named object and strand you on an arbitrary one of them. The
        // path is what's actually unique enough to land back on this object.
        const part = wordAtCaret();
        if (part) {
          // Complete only the word before the caret; its rest (e.g. a prefilled path) stays.
          const word = item.type === 'command' ? escKept(item) + item.id : (item.path ?? item.title);
          input.value = word + part.tail;
          input.setSelectionRange(word.length, word.length);
        } else {
          input.value = item.type === 'command' ? escKept(item) + item.id + ' ' : (item.path ?? item.title);
        }
        activeIdx = 0;
        chosen = true;
        render();
        if (mode === 'args') { chosen = false; render(); }   // Tab landed in arguments: nothing is chosen there yet
      } else if (act === 'next') {
        e.preventDefault();
        moveSel(+1);
      } else if (act === 'prev') {
        e.preventDefault();
        moveSel(-1);
      }
    });

    // ── init ───────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      input.focus();
      if (INITIAL && typeof INITIAL.text === 'string') {
        input.value = INITIAL.text;
        const at = Math.max(0, Math.min(Number(INITIAL.cursor) || 0, input.value.length));
        input.setSelectionRange(at, at);   // before render: the caret decides which word is ranked
      }
      render();
    });
  </script>

</body>
</html>
