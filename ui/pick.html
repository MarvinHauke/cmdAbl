<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>cmdAbl</title>
  <style>
    /*SHARED_CSS_PLACEHOLDER*/

    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    #title { padding: 8px 12px 0; color: var(--dim); font-size: 11px; flex-shrink: 0; }

    #bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #prompt { color: var(--accent); font-weight: 700; user-select: none; }
    #filter {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font: inherit;
      caret-color: var(--accent);
    }

    #list { flex: 1; overflow-y: auto; }
    .row { display: flex; align-items: baseline; gap: 10px; padding: 5px 12px; cursor: default; }
    .row.active { background: var(--bg-row); }
    .row.active .label { color: var(--accent); }
    .mark { width: 10px; color: var(--accent); }
    .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail { color: var(--dim); font-size: 11px; }

    #hint {
      padding: 5px 12px;
      border-top: 1px solid var(--border);
      color: var(--dim);
      font-size: 10px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div id="title"></div>
  <div id="bar">
    <span id="prompt">?</span>
    <input id="filter" type="text" autocomplete="off" spellcheck="false" />
  </div>
  <div id="list"></div>
  <div id="hint"></div>

  <script>
    // Injected by the extension: { title, multi, items: [{ label, detail }] }
    const PICK = /*PICK_PLACEHOLDER*/null;

    const filter = document.getElementById('filter');
    const list   = document.getElementById('list');

    const marked = new Set();   // indexes into PICK.items
    let visible  = [];          // indexes into PICK.items, after filtering
    let active   = 0;           // position within `visible`

    function send(indexes) {
      const payload = indexes && indexes.length ? JSON.stringify(indexes) : '';
      const msg = { method: 'close_and_send', params: [payload] };
      if (window.webkit?.messageHandlers?.live) window.webkit.messageHandlers.live.postMessage(msg);
      else if (window.chrome?.webview) window.chrome.webview.postMessage(msg);
    }

    function render() {
      const needle = filter.value.trim().toLowerCase();
      visible = PICK.items
        .map((_, i) => i)
        .filter(i => !needle || PICK.items[i].label.toLowerCase().includes(needle));
      active = Math.min(active, Math.max(visible.length - 1, 0));

      list.innerHTML = '';
      visible.forEach((index, pos) => {
        const item = PICK.items[index];
        const row = document.createElement('div');
        row.className = 'row' + (pos === active ? ' active' : '');
        const mark = document.createElement('span');
        mark.className = 'mark';
        mark.textContent = marked.has(index) ? '●' : '';
        // textContent, not innerHTML: labels are user data (track names).
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = item.label;
        const detail = document.createElement('span');
        detail.className = 'detail';
        detail.textContent = item.detail ?? '';
        row.append(mark, label, detail);
        row.addEventListener('mousedown', e => {
          e.preventDefault();
          if (PICK.multi) { toggle(index); active = pos; render(); }
          else send([index]);
        });
        list.appendChild(row);
      });
      list.querySelector('.active')?.scrollIntoView({ block: 'nearest' });
    }

    function toggle(index) {
      if (marked.has(index)) marked.delete(index); else marked.add(index);
    }

    function move(delta) {
      if (!visible.length) return;
      active = (active + delta + visible.length) % visible.length;
      render();
    }

    filter.addEventListener('input', () => { active = 0; render(); });

    filter.addEventListener('keydown', e => {
      const ctrl = e.ctrlKey && !e.metaKey && !e.altKey;
      if (e.key === 'Escape') {
        e.preventDefault();
        send(null);
      } else if (e.key === 'ArrowDown' || (ctrl && e.key === 'n')) {
        e.preventDefault();
        move(1);
      } else if (e.key === 'ArrowUp' || (ctrl && e.key === 'p')) {
        e.preventDefault();
        move(-1);
      } else if (e.key === 'Tab') {
        e.preventDefault();
        if (!PICK.multi || !visible.length) return;
        toggle(visible[active]);
        move(1);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (marked.size) send([...marked].sort((a, b) => a - b));
        else if (visible.length) send([visible[active]]);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('title').textContent = PICK.title;
      document.getElementById('hint').textContent = PICK.multi
        ? 'Tab mark · Enter confirm · Esc cancel · type to filter'
        : 'Enter choose · Esc cancel · type to filter';
      render();
      filter.focus();
    });
  </script>

</body>
</html>
