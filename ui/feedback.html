<!DOCTYPE html>
<!-- notify surface (see src/core/ui.ts). In: MESSAGE_PLACEHOLDER = the message string; LINK_PLACEHOLDER = null or { label, url } (an accent button with the label next to Close, the url as its tooltip; the page never opens or returns the url). Out: '' (Close, Esc, Enter), or '{"open":true}' when the link button is clicked (core opens its own copy of the url). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <title>cmdAbl</title>
  <style>
    /*SHARED_CSS_PLACEHOLDER*/

    html, body { height: 100%; overflow: hidden; }
    body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    /* The text scrolls on its own (vertically); the button below stays in view.
       Long words and paths break anywhere: never a horizontal scrollbar. */
    #msg {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      font: inherit;
      line-height: 18px;
      outline: none;
    }
    /* One block per line; a wrapped line hangs under its own text (see the script). */
    #msg .line { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 18px; }
    #msg .group { margin-top: 9px; }   /* before each × group after the first */
    #footer { flex-shrink: 0; display: flex; gap: 8px; }
    #link { border-color: var(--accent); color: var(--accent); }
    #link[hidden] { display: none; }
  </style>
</head>
<body>

  <div id="msg" tabindex="-1"></div>
  <div id="footer"><button id="close">Close</button><button id="link" hidden></button></div>

  <script>
    // Injected at runtime — the raw feedback message string.
    const MESSAGE = /*MESSAGE_PLACEHOLDER*/null;

    // Injected at runtime — null or { label, url }.
    const LINK = /*LINK_PLACEHOLDER*/null;

    function send(value) {
      const m = { method: 'close_and_send', params: [value] };
      if (window.webkit?.messageHandlers?.live) window.webkit.messageHandlers.live.postMessage(m);
      else if (window.chrome?.webview) window.chrome.webview.postMessage(m);
    }

    // Each line becomes its own block: padding-left = the line's leading spaces (in ch), and the
    // "✓ "/"× " marker hangs (negative text-indent), so a wrapped part stays under the text.
    // The markers are the presenter's (src/core/present.ts): add one on both sides or neither.
    // Text goes in with textContent (paths and reasons are user data).
    function renderMessage(box, text) {
      let seenFail = false, prevFail = false;
      for (const raw of String(text).split('\n')) {
        const lead = raw.length - raw.trimStart().length;
        const body = raw.trimStart();
        const marker = /^[✓×] /.test(body) ? 2 : 0;
        const row = document.createElement('div');
        row.className = 'line';
        row.style.paddingLeft = (lead + marker) + 'ch';
        if (marker) row.style.textIndent = '-' + marker + 'ch';
        row.textContent = body;
        const fail = body.startsWith('× ');
        if (fail && !prevFail && seenFail) row.classList.add('group');
        if (fail) seenFail = true;
        prevFail = fail;
        box.appendChild(row);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderMessage(document.getElementById('msg'), MESSAGE ?? '');
      const close = document.getElementById('close');
      close.addEventListener('click', () => send(''));
      // The link button answers {"open":true}; core opens its own copy of the url. Text via textContent.
      if (LINK && typeof LINK.label === 'string' && LINK.label) {
        const link = document.getElementById('link');
        link.textContent = LINK.label;
        if (typeof LINK.url === 'string') link.title = LINK.url;
        link.hidden = false;
        link.addEventListener('click', () => send('{"open":true}'));
      }
      document.addEventListener('keydown', e => {
        if (e.repeat) return;   // a held Enter from the dialog before must not close this one
        // Tab reaches the link button; Enter on it activates it (a click), everywhere else Enter closes.
        if (e.key === 'Enter' && document.activeElement === document.getElementById('link')) return;
        if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); send(''); }
      });
      // Focus the text, not the button: arrows and Page Up/Down then scroll it natively.
      document.getElementById('msg').focus();
    });
  </script>

</body>
</html>
