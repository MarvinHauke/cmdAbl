<!DOCTYPE html>
<!-- notify surface (see src/core/ui.ts). In: MESSAGE_PLACEHOLDER = the message string. Out: nothing (closes with ''). Esc and Enter close it like the button. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>cmdAbl</title>
  <style>
    /*SHARED_CSS_PLACEHOLDER*/

    html, body { height: 100%; overflow: hidden; }
    body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    /* The text scrolls on its own (vertically); the button below stays in view.
       Long words and paths break anywhere: never a horizontal scrollbar. */
    #msg {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      font: inherit;
      line-height: 18px;
      outline: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    #footer { flex-shrink: 0; }
  </style>
</head>
<body>

  <pre id="msg" tabindex="-1"></pre>
  <div id="footer"><button id="close">Close</button></div>

  <script>
    // Injected at runtime — the raw feedback message string.
    const MESSAGE = /*MESSAGE_PLACEHOLDER*/null;

    function send(value) {
      const m = { method: 'close_and_send', params: [value] };
      if (window.webkit?.messageHandlers?.live) window.webkit.messageHandlers.live.postMessage(m);
      else if (window.chrome?.webview) window.chrome.webview.postMessage(m);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('msg').textContent = MESSAGE ?? '';
      const close = document.getElementById('close');
      close.addEventListener('click', () => send(''));
      document.addEventListener('keydown', e => {
        if (e.repeat) return;   // a held Enter from the dialog before must not close this one
        if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); send(''); }
      });
      // Focus the text, not the button: arrows and Page Up/Down then scroll it natively.
      document.getElementById('msg').focus();
    });
  </script>

</body>
</html>
