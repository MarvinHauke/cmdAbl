<!DOCTYPE html>
<!-- board surface (see src/core/ui.ts BoardRequest, plan 0010). In: BOARD_PLACEHOLDER = { title, help?: boolean (false: the footer line shows only the keys / state lines, never the help of the hovered or focused element; plan 0019 §3, ui/help.js), sections: [{ id, heading, meta?, items: [{ id, label, on }], readonly? }], create?: { label, pattern? }, apply: { label } }. A section shows, in its heading line, a fold arrow, the name, an inline input ("+ add track to #tag…", like the tag bar in Live's browser) and the count; below it come its on items as chips with × (a click marks one for removal: struck through with an accent outline; another click unmarks it). A tag is open by default and starts folded when it has more than FOLD_AFTER (20) tracks (on a heading — reached with ↑/↓ — → unfolds and ← folds, or the arrow button); a folded heading shows the pending changes as "+2 ×1"; adding by typing unfolds. The input: typing searches the section's items that are not on (or are pending removal), best match as ghost text plus up to 6 suggestion chips (↑/↓ move the highlight while they show); Tab puts the highlighted one into the input (stays in the field; on an empty input Tab leaves it as usual), Enter adds the highlighted one as a chip with a dashed accent ring. Keys, like a file tree (deeper = →, out = ←): ↑/↓ move only between headings (the New tag field, each tag heading, the untagged heading); → on a heading unfolds it, on an open one goes into its add field; while suggestions show and the caret is at the end, → enters the suggestion row on the highlighted one (shown filled; →/← walk it, → on the last stays; ← on the first goes back to the field; a typed character or Backspace goes back and edits; Esc leaves it, then clears the field; Enter adds (the typed text and the list stay, in the field and in the row: the added track leaves the list and the highlight moves to the next one, so several similar names go in a row; an empty list returns to the field, the text stays; Esc clears), Tab completes the text with it and returns to the field); → in the field with the caret at the far end (empty included, or no suggestions showing) puts a chip cursor on the first chip (←/→ walk the chips, → on the last stays, ← on the first goes back to the field); ← in the field at caret 0 goes to the heading; ← on an open heading folds it; ↑/↓ inside a tag go to its heading / the next heading. The New tag field works the same with the collected chips. Chip cursor: Backspace/Delete toggle the removal mark of the chip under it, typing/Esc/Tab return to the input, Enter applies. Typing a printable character on a tag heading unfolds the tag and puts the character into its add field (suggestions open, the tag becomes the target); on the untagged heading or its chips it goes into the target tag's field (New tag when that is the target). The target is the tag whose add field (or chips) was entered last: passing a heading with ↑/↓ doesn't change it, so a track can be assigned to the tag you left, from the untagged heading. A readonly section shows chips only; today it is also built last and starts folded ("▸ untagged · 35 tracks", the heading toggles it on click / Enter / Space), because tag is the only user — a second user that marks sections readonly for other reasons needs an explicit `folded?` flag from core and the caller's order kept. The "+ # New tag…" row is pinned above the sections; a created section is added directly below it, focused and in view. create adds an empty section from an input at the bottom (name checked against pattern, a regular expression the whole name must match). A created section with nothing added sends nothing. A section with renamable / removable shows a heading whose name is editable in place (click it, or F2 in the section's input: an inline input; the leading # stays outside) and a × at the right end of the heading: the name's input (Enter takes the name if it matches create.pattern, else shake; Esc cancels the edit only; the heading then shows the new name and, dimmed on the same line, "(was #old)"), × (or Shift+Backspace in an empty input, or Shift+Tab to the buttons and Enter) marks the whole tag for removal (struck through, chips dimmed; the footer says what will be removed; a second click unmarks it). Gear: BOARD.gear draws a Settings button in the footer; it answers { settings: true } and nothing else (with pending changes the confirm bar asks "Discard N changes and open settings?" first). BOARD.foldAfter replaces FOLD_AFTER (default 20). Out (close_and_send): '' when closed (Close, Esc; with pending changes the first one only warns in the footer, the second discards), or JSON { changes: [{ section, item, on }], created: [names], renamed?: [{ section, to }], removed?: [section], confirmed?: true } on Apply (confirmed with removed: Apply with a tag marked for removal first shows a confirm bar in the footer, "Remove #fx from N tracks?" with Cancel (default, Esc) and Remove and apply): only real differences against the request (a section marked for removal sends only `removed`: its own chip changes and rename are dropped); a created section's id is its name and its items start off. Only the × of a chip removes (or undoes); a click on its name selects it for the keys (Backspace removes). A track whose last tag is marked off or removed shows in untagged as a dashed card (assign it to another tag in the same change; with every track tagged the request has no untagged section, so a hidden stand-in appears, open, with the first card and hides again when the last one is gone, taking no part in ↑/↓ and Tab while hidden); a tag with all its tracks marked off is struck through with "tag goes away". The New tag row works like a tag row: its collected tracks are chips below the field, the help is in the footer. Click to assign: the target is the tag whose add field was focused last (highlighted; footer "Click tracks to add them to #drums") or the New tag field; a click on an untagged chip adds that track to the target as a pending chip and the track leaves the untagged list (× on the pending chip brings it back), or, for the New tag field, collects it in a line below the field ("goes into the new tag: …", each with ×) until a name + Enter creates the tag with them (Esc clears); the page opens in the New tag field; chips of other tags don't assign. Keyboard: Tab to the untagged heading, ↓/→ puts a chip cursor on the tracks (←/→/↑/↓ move, Enter or Space assigns to the active target, Esc leaves). The footer line is the help line (ui/help.js): the data-help of the hovered or focused element, else the keys or the state line (what is marked for removal, click-to-assign); the warning for pending changes wins over all. Text goes in with textContent only (headings and labels are user data). The board's title is not drawn: the dialog already names the command. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <title>cmdAbl</title>
  <style>
    /*SHARED_CSS_PLACEHOLDER*/

    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    #scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 10px 12px 8px; }
    #scroll:focus { outline: none; }

    /* One section: heading line (heading, meta right), then chips with the add input last. */
    .sec { padding: 2px 6px 4px; margin: 0 -6px; border-radius: 3px; }
    .sec.target { background: hsla(0, 0%, 100%, 0.045); box-shadow: inset 2px 0 0 var(--accent); }   /* the tag being added to (typing and clicking untagged tracks) */
    .sec + .sec { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); border-top-left-radius: 0; border-top-right-radius: 0; }
    .head { display: flex; align-items: baseline; gap: 8px; padding: 2px 0; min-height: 24px; }
    .head .h { color: var(--accent); font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
    .head .fold { flex: none; width: 24px; height: 24px; margin: -3px 0 -3px -6px; border: none; background: transparent; color: var(--dim); font: inherit; font-size: 11px; padding: 0; text-align: center; cursor: default; border-radius: 3px; }
    .head .fold:hover { color: var(--text); }
    .head .pend { flex: none; color: var(--accent); font-size: 11px; }   /* pending changes inside a folded section */
    .head .addwrap { flex: 0 1 auto; min-width: 12ch; }   /* the add field lives in the heading line; it may shrink, never wrap the chips */
    .head .meta { margin-left: auto; flex: none; color: var(--dim); font-size: 11px; }
    .sec.ro .head .h { color: var(--dim); }
    /* Heading (renamable / removable): the "#" in the accent colour, the name editable in place (click or F2), the
       "(was #old)" note dimmed on the same line, and × at the right end (a 24 px hit area, red on hover). */
    .head { align-items: center; }
    .head .hash { color: var(--accent); }
    .head .nm { color: var(--text); }
    .sec.ro .head .nm { color: var(--dim); }
    .head .nm.edit { cursor: text; border-radius: 2px; }
    .head .nm.edit:hover { text-decoration: underline dotted var(--dim); text-underline-offset: 3px; }
    .head .renamed { flex: none; color: var(--dim); font-size: 11px; font-weight: 400; }
    .head .push { margin-left: auto; }
    .head .act { flex: none; width: 24px; height: 24px; margin: -3px 0; border: none; background: transparent; color: var(--dim); font: inherit; font-size: 15px; line-height: 24px;
                 padding: 0; text-align: center; cursor: default; border-radius: 3px; }
    .head .act:hover, .head .act:focus-visible { color: hsl(0, 75%, 62%); outline: none; }
    .head .act.on { color: hsl(0, 75%, 62%); }
    .head input.rn { flex: 0 1 auto; min-width: 6ch; box-sizing: border-box; background: var(--bg-row); border: 1px solid var(--accent); border-radius: 2px; outline: none;
                     color: var(--text); font: inherit; font-weight: 700; line-height: 16px; padding: 3px 4px; caret-color: var(--accent); }
    .head .rnerr { flex: none; color: var(--accent); font-size: 11px; font-weight: 400; }
    .sec.gone .head .h, .sec.gone .head .hash, .sec.gone .head .nm, .sec.dying .head .h, .sec.dying .head .hash, .sec.dying .head .nm { text-decoration: line-through; color: var(--dim); }
    .head .die { flex: none; color: var(--accent); font-size: 11px; }
    .head .die[hidden] { display: none; }
    .sec.gone .chips { opacity: 0.4; }

    .chips[hidden] { display: none; }
    /* A read-only section (untagged) folds: the heading is the toggle, collapsed by default. */
    .sec.ro .head { cursor: default; border-radius: 2px; }
    .sec.ro .head:hover .nm, .sec.ro .head:focus-visible .nm { color: var(--text); }
    .head:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
    .head .meta.inl { margin-left: 0; }   /* the folded heading reads "▸ untagged · 35 tracks" */
    .head .caret { color: var(--dim); width: 1.2ch; flex: none; }
    .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 8px; }
    .chip { display: inline-flex; align-items: baseline; gap: 6px; background: var(--bg-row); border: 1px solid var(--border);
            border-radius: 2px; padding: 0 6px; line-height: 22px; overflow-wrap: anywhere; min-width: 0; cursor: default; }
    .chip .x { color: var(--dim); font-size: 11px; user-select: none; }
    .chip:hover .x { color: var(--text); }
    /* Marked for removal: struck through with an accent outline. Added (not in Live yet): dashed accent ring. */
    .chip.rm { text-decoration: line-through; color: var(--dim); outline: 1px solid var(--accent); outline-offset: 1px; }
    .chip.add { outline: 1px dashed var(--accent); outline-offset: 1px; }
    /* The chip cursor (← / → in the add input): a tint and an accent underline; the input caret hides. */
    .chip.pick { cursor: pointer; }
    .chip.pick:hover { border-color: var(--accent); }
    .chip.cur { background: hsla(31, 100%, 67%, 0.22); box-shadow: inset 0 -2px 0 var(--accent); }
    .addwrap.chipmode input { caret-color: transparent; }
    .none { color: var(--dim); font-size: 11px; line-height: 24px; }
    .chips:empty { display: none; }
    .chip.card { border-style: dashed; border-color: var(--accent); color: var(--text); }   /* a track that will have no tag after Apply */
    .chip .x { display: inline-block; padding: 0 6px; margin: 0 -6px 0 -4px; cursor: default; }   /* a 24 px tall hit area: only the × removes */

    /* The inline input is the last "chip": a dashed outline, ghost text behind the typed text. */
    .addwrap { position: relative; display: inline-block; max-width: 100%; }
    .addwrap input { position: relative; z-index: 1; box-sizing: border-box; background: var(--bg-row); border: 1px solid var(--dim); border-radius: 2px;
                     outline: none; color: var(--text); font: inherit; line-height: 16px; padding: 3px 6px; caret-color: var(--accent); max-width: 100%; }
    .addwrap.insel input:focus { border-color: var(--dim); box-shadow: none; }
    .addwrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .addwrap input::placeholder { color: var(--dim); }
    .ghost { position: absolute; left: 7px; top: 4px; line-height: 16px; white-space: pre; pointer-events: none; color: var(--dim); }
    .ghost .typed { visibility: hidden; }
    .nomatch { color: var(--accent); font-size: 11px; }

    /* Suggestions under the chips (focused section only): the highlighted one has an accent border. */
    .sugs { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 4px 0 2px; }
    .sugs:empty { display: none; }
    .chip.sug { cursor: default; color: var(--text); }
    .chip.sug.hi { border-color: var(--accent); color: var(--accent); }
    .chip.sug.sel { background: var(--accent); color: var(--bg); }   /* the cursor is in the list (→ from the field), not just the ghost-text default */
    .chip.sug .re { color: var(--dim); font-size: 11px; }

    /* The create entry at the bottom. */
    /* The new-tag row is pinned above all sections: first in the Tab order and always in view. */
    #create { flex: 0 0 auto; padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
    #create.target { background: hsla(0, 0%, 100%, 0.045); box-shadow: inset 2px 0 0 var(--accent); }
    #create .crow { display: flex; align-items: center; gap: 8px; }
    /* The tracks collected for the new tag (clicks on untagged chips while this field is the target). */
    #collected { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-height: 24px; }
    #collected[hidden] { display: none; }
    #create .plus { color: var(--accent); font-weight: 700; user-select: none; }
    #create[hidden] { display: none; }

    #footer { flex-shrink: 0; border-top: 1px solid var(--border); padding: 6px 12px; display: flex; align-items: center; gap: 8px; }
    #hint { flex: 1; min-width: 0; color: var(--dim); font-size: 11px; line-height: 14px; }
    #hint { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; height: 28px; }   /* always two lines, clamped: the footer never changes height, whatever the help says */
    #apply { flex: none; min-width: 19ch; /* "Apply (99 changes)": the label's width doesn't change the hint's line breaks while keys are pressed */ border-color: var(--accent); color: var(--accent); }
    #apply:disabled { border-color: var(--dim); color: var(--dim); opacity: 0.5; cursor: default; }
    #close { flex: none; }
    #gear { flex: none; min-height: 24px; display: inline-flex; align-items: center; font-size: 12px; }
    #gear[hidden] { display: none; }
    #gear:focus-visible, #apply:focus-visible, #close:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* The confirm bar (Apply with a whole tag marked for removal): replaces the footer's line and buttons. */
    #footer.confirming { background: hsla(31, 100%, 67%, 0.12); border-top-color: var(--accent); }
    #confirm { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
    #confirm[hidden] { display: none; }
    #confirmText { flex: 1; min-width: 0; color: var(--accent); font-weight: 700; overflow-wrap: anywhere; }
    #confirmNo { flex: none; border-color: var(--accent); color: var(--accent); }
    #confirmYes { flex: none; border-color: hsl(0, 75%, 62%); color: hsl(0, 75%, 62%); }
  </style>
</head>
<body>

  <div id="create" hidden></div>
  <div id="scroll">
    <div id="sections"></div>
  </div>
  <div id="footer">
    <span id="hint"></span>
    <button id="gear" type="button" hidden data-help="Settings: open the settings page">Settings</button>
    <button id="apply" disabled data-help="Apply: save all changes and close"></button>
    <button id="close" data-help="Close: leave without saving (Esc)">Close</button>
    <div id="confirm" hidden><span id="confirmText"></span><button id="confirmNo" type="button">Cancel</button><button id="confirmYes" type="button"></button></div>
  </div>

  <script>/*HELP_JS_PLACEHOLDER*/</script>

  <script>
    // Injected by the extension: see the contract at the top.
    const BOARD = /*BOARD_PLACEHOLDER*/null;

    function send(value) {
      const m = { method: 'close_and_send', params: [value] };
      if (window.webkit?.messageHandlers?.live) window.webkit.messageHandlers.live.postMessage(m);
      else if (window.chrome?.webview) window.chrome.webview.postMessage(m);
    }

    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;   // user data: textContent only
      return e;
    };

    // ---- model ---------------------------------------------------------------------------
    // orig = the state in the request; cur = the pending state. `added` = item indexes turned on
    // here, in the order added (their chips follow the section's own chips).
    const S = (BOARD?.sections ?? []).map(s => ({
      id: s.id, heading: s.heading, meta: s.meta, readonly: !!s.readonly, created: false, q: '', hi: 0, added: [], cc: null,
      renamable: !!s.renamable && !s.readonly, removable: !!s.removable && !s.readonly, rename: null, removeAll: false,
      items: (s.items ?? []).map(i => ({ id: i.id, label: i.label ?? i.id, orig: !!i.on, cur: !!i.on, u: !!s.readonly && !!i.on })),
    }));
    // A created section can carry any item the request names (first label wins), all off.
    const candidates = [];
    { const seen = new Set();
      for (const s of S) for (const i of s.items) if (!seen.has(i.id)) { seen.add(i.id); candidates.push({ id: i.id, label: i.label }); } }
    // The read-only (untagged) section also knows every other track (`u` false): one that loses its last tag shows up
    // there as a card, so it can be given another tag in the same change.
    // Every track tagged: the request has no untagged section. A hidden one stands in (`virtual`): it appears, open, as soon
    // as one track would lose its last tag (a card) and hides again when the last card is gone.
    if (candidates.length && !S.some(s => s.readonly))
      S.push({ id: '~untagged', heading: 'untagged', meta: 'no tracks', readonly: true, virtual: true, created: false, q: '', hi: 0, added: [], cc: null,
               renamable: false, removable: false, rename: null, removeAll: false, items: [] });
    for (const s of S) {
      if (s.readonly) { const has = new Set(s.items.map(i => i.id)); for (const c of candidates) if (!has.has(c.id)) s.items.push({ id: c.id, label: c.label, orig: false, cur: false, u: false }); }
      s.byId = new Map(s.items.map(i => [i.id, i]));
    }

    // Only the × of a chip removes (or undoes); a click on its name selects it for the keys (Backspace removes). A track whose last tag is marked off or removed shows in untagged as a dashed card (assign it to another tag in the same change); a tag with all its tracks marked off is struck through with "tag goes away". The New tag row works like a tag row: its collected tracks are chips below the field, the help is in the footer. Click to assign: the target is the tag whose add field was focused last (index into S), or -1 = the "New tag"
    // field; `collected` = track ids clicked while the new-tag field is the target, waiting for a name.
    const FOLD_AFTER = BOARD.foldAfter ?? 20;   // a tag with more tracks than this starts folded (core passes the tag.foldAfter setting)
    let target = -1, quiet = false;
    const collected = [];
    let ccNew = null;   // the chip cursor on the collected tracks (a track id), DOM focus stays in the New tag field

    function changes() {
      const out = [];
      for (const s of S) {
        if (s.readonly || s.removeAll) continue;   // a tag marked for removal sends only that
        for (const i of s.items) if (i.cur !== i.orig) out.push({ section: s.id, item: i.id, on: i.cur });
      }
      return out;
    }
    const renames = () => S.filter(s => s.rename !== null && !s.removeAll).map(s => ({ section: s.id, to: s.rename }));
    const removals = () => S.filter(s => s.removeAll).map(s => s.id);
    // A rename still being typed counts too (valid and different), so Apply is live while the input is open.
    const drafts = () => S.filter(s => s.renaming && s.draftOk && s.draftOk()).length;
    const pending = () => changes().length + renames().length + removals().length + drafts();
    function createdNames() { return S.filter(s => s.created && s.items.some(i => i.cur)).map(s => s.id); }

    // Esc or Close with pending changes warns first (footer); a second Esc or Close discards,
    // any other key cancels the warning. Without changes it closes at once.
    const hintEl = document.getElementById('hint');
    const keyHint = [['Tab', 'complete'], ['⌫', 'remove'], ...(S.some(s => s.renamable) ? [['F2', 'rename']] : []), ['↑↓', 'tags'], ['→', 'into'], ['←', 'out']];
    // The footer line: what whole tags will be removed (once marked), else the keys.
    // A suggestion list is showing in the focused add field: ←/→ walk it (instead of going into the chips).
    const sugOpen = () => S.some(s => s.inputEl && s.inputEl === document.activeElement && s.q && (s.sugList?.length ?? 0) > 0);
    function curHint() {
      const gone = S.filter(s => s.removeAll);
      if (!gone.length && sugOpen()) return S.some(s => s.sel) ? [['←→', 'pick'], ['Tab', 'complete'], ['Enter', 'add'], ['Esc', 'back']] : [['→', 'pick'], ['Tab', 'complete'], ['Enter', 'add'], ['Esc', 'clear']];
      if (!gone.length) { const a = assignHint(); return a ? (target < 0 ? a : [a, ...keyHint]) : keyHint; }
      const part = s => s.heading + (gone.length > 1 ? ' (' + s.items.filter(i => i.orig).length + ')' : '');
      if (gone.length === 1) { const n = gone[0].items.filter(i => i.orig).length; return gone[0].heading + ' will be removed from ' + n + ' track' + (n === 1 ? '' : 's') + ' · Apply to confirm'; }
      return gone.map(part).join(', ') + ' will be removed · Apply to confirm';
    }
    // Something to click on? A real read-only section, or the hidden stand-in while it shows a card.
    const pickable = () => S.some(s => s.readonly && (!s.virtual || s.shown));
    let armed = false, armedText = '';
    function disarm() { if (!armed) return; armed = false; help.update(); }
    function requestClose() {
      const n = pending() || (collected.length ? 1 : 0);
      if (n && !armed) {
        armed = true;
        armedText = n + ' change' + (n === 1 ? '' : 's') + ' not applied — Esc again to discard';
        help.update();
        return;
      }
      send('');
    }
    document.addEventListener('keydown', e => {
      if (armed && e.key !== 'Escape' && !['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) disarm();
    }, true);
    // A click anywhere but on Close also cancels the warning (the count shown would be stale).
    document.addEventListener('mousedown', e => { if (!(e.target instanceof Element && e.target.closest('#close'))) disarm(); }, true);

    // Apply with a whole tag marked for removal asks first (a bar in the footer: Cancel is the default, Esc cancels;
    // the marks stay). The answer then carries `confirmed: true` next to `removed`.
    const footerEl = document.getElementById('footer'), confirmBox = document.getElementById('confirm');
    const footerBits = ['hint', 'gear', 'apply', 'close'].map(id => document.getElementById(id));
    let confirming = false, beforeConfirm = null, onConfirmYes = null;
    // The bar asks one question: Apply with tags marked for removal, or the gear with pending changes.
    function showConfirm(text, yesLabel, yes) {
      document.getElementById('confirmText').textContent = text;
      document.getElementById('confirmYes').textContent = yesLabel;
      onConfirmYes = yes;
      beforeConfirm = document.activeElement;
      confirming = true;
      footerEl.classList.add('confirming');
      footerBits.forEach(b => { b.hidden = true; });
      confirmBox.hidden = false;
      document.getElementById('confirmNo').focus();
    }
    function cancelConfirm(refocus = true) {
      if (!confirming) return;
      confirming = false;
      footerEl.classList.remove('confirming');
      footerBits.forEach(b => { b.hidden = false; });
      confirmBox.hidden = true;
      if (refocus) (beforeConfirm instanceof HTMLElement && beforeConfirm !== document.body && document.contains(beforeConfirm) ? beforeConfirm : firstInput()?.input)?.focus({ preventScroll: true });
    }

    function apply(confirmed = false) {
      for (const s of S) if (s.renaming) s.finishEdit(true);   // an open rename is taken first
      if (collected.length) {   // tracks waiting for the new tag: it needs its name first (a valid one creates it now)
        if (createInput.value.trim()) submitCreate();
        if (collected.length) { needName(); return; }
      }
      const list = changes(), ren = renames(), rem = removals();
      if (!list.length && !ren.length && !rem.length) return;
      if (rem.length && !confirmed) {
        const tracks = new Set();
        for (const s of S.filter(s => s.removeAll)) for (const i of s.items) if (i.orig) tracks.add(i.id);
        showConfirm('Remove ' + S.filter(s => s.removeAll).map(s => s.heading).join(', ') + ' from ' + tracks.size + ' track' + (tracks.size === 1 ? '' : 's') + '?', 'Remove and apply', () => apply(true));
        return;
      }
      const out = { changes: list, created: createdNames() };
      if (ren.length) out.renamed = ren;
      if (rem.length) { out.removed = rem; out.confirmed = true; }
      send(JSON.stringify(out));
    }

    // The chips of a section in display order: its own on items (marked ones stay, struck), then
    // the ones added here in the order added.
    // A track that is pending in any tag (or collected for the new one) leaves "untagged"; undoing it brings it back.
    function claimedSet() {
      const out = new Set(collected);
      for (const t of S) if (!t.readonly && !t.removeAll) for (const i of t.items) if (i.cur && !i.orig) out.add(i.id);
      return out;
    }
    // A track that has a tag now and will have none after Apply (its last tag marked off or removed): a card in untagged.
    function orphan(id, claimed) {
      if (claimed.has(id)) return false;
      let was = false, now = false;
      for (const t of S) {
        if (t.readonly) continue;
        const i = t.byId.get(id);
        if (!i) continue;
        if (i.orig) was = true;
        if (i.cur && !t.removeAll) now = true;
      }
      return was && !now;
    }
    function chipIdx(s) {
      const out = [];
      if (s.readonly) {
        const claimed = claimedSet();
        s.items.forEach((i, ii) => { if (i.u ? !claimed.has(i.id) : orphan(i.id, claimed)) out.push(ii); });
        return out;
      }
      s.items.forEach((i, ii) => { if (i.orig) out.push(ii); });
      for (const ii of s.added) if (s.items[ii].cur) out.push(ii);
      return out;
    }

    function toggleItem(si, ii) {
      const s = S[si];
      if (s.readonly) return;
      const i = s.items[ii];
      i.cur = !i.cur;
      if (!i.orig) { s.added = s.added.filter(x => x !== ii); if (i.cur) s.added.push(ii); }
      refresh(si);
    }

    // ---- click to assign ---------------------------------------------------------------------
    const targetName = () => target >= 0 && S[target] ? shownName(S[target]) : 'the new tag';
    function assignHint() {
      if (!pickable()) return '';
      if (target < 0 || !S[target]) return createInput ? 'Click untagged tracks to collect them · name + Enter creates the tag · Esc clears' : "Focus a tag's add field, then click tracks";
      return S[target].removeAll ? shownName(S[target]) + ' is marked for removal' : 'Click tracks to add them to ' + shownName(S[target]);
    }
    function renderUntagged() { S.forEach((s, si) => { if (s.readonly && s.chipsEl) renderChips(si); }); }
    const collectedEl = el('div'); collectedEl.id = 'collected';
    function renderCollected() {
      const label = id => candidates.find(c => c.id === id)?.label ?? id;
      collectedEl.hidden = !pickable();
      if (ccNew != null && !collected.includes(ccNew)) ccNew = null;
      createWrap?.classList.toggle('chipmode', ccNew != null);
      collectedEl.replaceChildren();
      if (!collected.length) { collectedEl.append(el('span', 'none', 'no tracks yet')); return; }   // like a tag without tracks
      for (const id of collected) {
        const chip = el('span', 'chip add' + (id === ccNew ? ' cur' : ''));
        chip.append(el('span', 'l', label(id)), el('span', 'x', '×'));
        chip.setAttribute('aria-label', 'to be added to the new tag (× undoes)');
        chip.addEventListener('mousedown', e => { e.preventDefault(); if (e.target.closest('.x')) uncollect(id); });
        collectedEl.append(chip);
      }
    }
    function uncollect(id) {
      const k = collected.indexOf(id);
      if (k < 0) return;
      collected.splice(k, 1);
      renderCollected(); renderUntagged(); updateFooter();
    }
    function setTarget(t) {
      if (t === target) return;
      target = t;
      S.forEach((s, si) => s.el?.classList.toggle('target', si === t));
      createBox.classList.toggle('target', t === -1);
      renderUntagged();
      updateFooter();
    }
    // Add (or undo) a track for the active target. The page doesn't scroll: the ring on the clicked chip is the result.
    function assignTrack(id, keepFocus) {
      quiet = true;
      try {
        if (target < 0 || !S[target]) {
          if (!createInput) return;
          if (!collected.includes(id)) collected.push(id);
          if (!keepFocus) createInput.focus({ preventScroll: true });
          renderCollected(); renderUntagged(); updateFooter();
          return;
        }
        const s = S[target];
        if (s.removeAll) return;
        const ii = s.items.findIndex(i => i.id === id);
        if (ii < 0) return;
        if (s.items[ii].orig && s.items[ii].cur) return;   // already tagged here
        toggleItem(target, ii);   // not on yet: adds it; marked off in this very tag: undoes the mark
      } finally { quiet = false; }
    }

    // ---- search ----------------------------------------------------------------------------
    // Candidates: items not on now (so also those marked for removal). Start of name first
    // (with or without the leading "/"), then start of the last path part, then anywhere.
    function rank(label, q) {
      const l = label.toLowerCase();
      if (l.startsWith(q) || l.replace(/^\//, '').startsWith(q)) return 0;
      if (l.slice(l.lastIndexOf('/') + 1).startsWith(q)) return 1;
      return l.includes(q) ? 2 : -1;
    }
    function suggestions(s) {
      const q = s.q.trim().toLowerCase();
      if (!q) return [];
      const out = [];
      s.items.forEach((i, ii) => {
        if (i.cur) return;
        const r = rank(i.label, q);
        const l = i.label.toLowerCase();
        if (r >= 0) out.push({ ii, r, exact: l === q || l.replace(/^\//, '') === q ? 0 : 1 });
      });
      out.sort((a, b) => a.r - b.r || a.exact - b.exact || a.ii - b.ii);   // an exact name first, so it survives the cap
      return out.slice(0, 6).map(o => o.ii);
    }
    // The ghost: the rest of the highlighted label, only when what was typed is a prefix of it.
    function ghostRest(label, q) {
      if (!q) return '';
      const l = label.toLowerCase(), lq = q.toLowerCase();
      if (l.startsWith(lq)) return label.slice(q.length);
      if (l.startsWith('/') && !lq.startsWith('/') && l.slice(1).startsWith(lq)) return label.slice(1 + q.length);
      return '';
    }

    // ---- rendering -------------------------------------------------------------------------
    const sectionsBox = document.getElementById('sections');
    const scroll = document.getElementById('scroll');
    const applyBtn = document.getElementById('apply');

    function updateFooter() {
      if (confirming) cancelConfirm(false);   // the marks changed under the question: ask again on Apply
      const n = pending();
      help.update();
      applyBtn.textContent = (BOARD?.apply?.label || 'Apply') + ' (' + n + ' change' + (n === 1 ? '' : 's') + ')';
      applyBtn.disabled = n === 0;
    }

    // Scroll the container by the least amount that shows the focused section as a whole (heading, chips,
    // input, suggestion row); a section taller than the view shows the part being worked on instead. No animation. The footer is outside the container, so nothing hides under it.
    // Touched by the first key or click: the focus on open never scrolls (the webview may still be
    // sizing the dialog then), and until then a resize puts the page back at the top.
    let touched = false;
    for (const type of ['keydown', 'mousedown']) document.addEventListener(type, () => { touched = true; }, true);
    window.addEventListener('resize', () => { if (!touched) scroll.scrollTop = 0; });
    if (window.ResizeObserver) new ResizeObserver(() => { if (!touched) scroll.scrollTop = 0; }).observe(scroll);
    // Scroll by the least amount that shows the block between `top` and `bottom` (viewport coordinates);
    // too tall for the view: its top wins. `first` (the first section) scrolls to 0, so nothing above it hides.
    function revealBlock(top, bottom, first) {
      const box = scroll.getBoundingClientRect();
      if (top < box.top || bottom - top > box.height) scroll.scrollTop = first ? 0 : scroll.scrollTop + top - box.top;
      else if (bottom > box.bottom) scroll.scrollTop += bottom - box.bottom;
    }
    // The focused section as a whole: heading, chips, input and suggestion row.
    function reveal(si) {
      const s = S[si];
      if (quiet || !touched || !s || !s.inputEl || document.activeElement !== s.inputEl) return;
      const r = s.el.getBoundingClientRect();
      if (r.height <= scroll.clientHeight) { revealBlock(r.top, r.bottom, s.el === sectionsBox.firstElementChild); return; }
      // Taller than the view: the part being worked on (input, chip under the cursor, suggestion row).
      const rects = [s.addEl.getBoundingClientRect()];
      const cur = s.chipsEl.querySelector('.chip.cur');
      if (cur) rects.push(cur.getBoundingClientRect());
      if (s.sugEls.firstChild) rects.push(s.sugEls.getBoundingClientRect());
      revealBlock(Math.min(...rects.map(x => x.top)), Math.max(...rects.map(x => x.bottom)), false);
    }
    function renderChips(si) {
      const s = S[si];
      for (const c of [...s.chipsEl.querySelectorAll('.chip, .none')]) c.remove();
      const idx = chipIdx(s);
      if (s.cc != null && !idx.includes(s.cc)) s.cc = null;
      s.addEl?.classList.toggle('chipmode', s.cc != null);
      for (const ii of idx) {
        const i = s.items[ii];
        const chip = el('span', 'chip' + (i.orig && !i.cur ? ' rm' : '') + (!i.orig && i.cur ? ' add' : '') + (ii === s.cc ? ' cur' : ''));
        chip.append(el('span', 'l', i.label));
        if (!s.readonly) {
          // Only the × removes (or undoes); a click on the name selects the chip (the chip cursor), the keys then act on it.
          chip.append(el('span', 'x', '×'));
          chip.dataset.help = 'Track: × removes it from this tag (or undoes a pending change), Backspace too when selected';
          chip.setAttribute('aria-label', i.label + ': ' + (i.orig && !i.cur ? 'marked for removal (× undoes)' : !i.orig && i.cur ? 'to be added (× undoes)' : '× removes it'));
          chip.addEventListener('mousedown', e => {
            e.preventDefault();
            if (e.target.closest('.x')) { toggleItem(si, ii); return; }
            if (document.activeElement !== s.inputEl) s.inputEl.focus({ preventScroll: true });
            s.cc = ii; renderChips(si);
          });
        } else {   // an untagged track (or a card for one that loses its last tag): a click adds it to the active target
          chip.className = 'chip pick' + (i.u ? '' : ' card') + (ii === s.cc ? ' cur' : '');
          chip.setAttribute('aria-label', i.label + ': ' + (i.u ? 'click to add to ' : 'will be untagged after Apply — click to add to ') + targetName());
          chip.addEventListener('mousedown', e => { e.preventDefault(); assignTrack(i.id); });
        }
        s.chipsEl.append(chip);
      }
      if (!idx.length && !s.readonly) s.chipsEl.append(el('span', 'none', 'no tracks yet'));
      if (s.readonly && s.metaEl) {
        const total = s.items.filter(i => i.u).length, cards = idx.filter(ii => !s.items[ii].u).length;
        if (cards && s.folded && !s.autoOpened) { s.autoOpened = true; setFold(si, false); }   // the first card opens untagged once, so the result is in view
        if (s.virtual) {   // the stand-in exists only while it holds a card; it opens again next time
          const show = idx.length > 0;
          if (!show) {
            s.autoOpened = false;
            if (s.el.contains(document.activeElement)) {   // focus must not fall to the body: back to the target's field (or New tag)
              const back = target >= 0 && S[target] && S[target].inputEl ? S[target].inputEl : createInput;
              back?.focus({ preventScroll: true });
            }
          }
          s.el.hidden = !show;
          if (show !== !!s.shown) { s.shown = show; renderCollected(); updateFooter(); }
        }
        s.metaEl.textContent = '· ' + (!idx.length ? 'none left' : cards ? idx.length + (idx.length === 1 ? ' track' : ' tracks') + ' · ' + cards + ' will be untagged' : idx.length === total ? s.meta : idx.length + ' of ' + total + ' tracks');
      }
      if (s.cc != null) reveal(si);
    }

    // Input width follows the typed text plus ghost; suggestions only for the focused section.
    function renderAdd(si) {
      const s = S[si];
      if (s.readonly) return;
      const sugs = suggestions(s);
      s.hi = Math.min(s.hi, Math.max(sugs.length - 1, 0));
      const focused = document.activeElement === s.inputEl;
      s.addEl.classList.toggle('insel', !!s.sel);   // one focus look at a time: the field's ring dims while the cursor is in the row
      const best = sugs.length ? s.items[sugs[s.hi]].label : '';
      const rest = ghostRest(best, s.q);
      s.ghostEl.replaceChildren(el('span', 'typed', s.q), document.createTextNode(rest));
      s.inputEl.style.width = 'calc(' + Math.max(s.inputEl.placeholder.length + 1, s.q.length + rest.length + 1) + 'ch + 14px)';
      s.rest = rest;
      s.sugEls.replaceChildren();
      if (focused) sugs.forEach((ii, k) => {
        const i = s.items[ii];
        const chip = el('span', 'chip sug' + (k === s.hi ? (s.sel ? ' hi sel' : ' hi') : ''));
        chip.dataset.help = 'Suggestion: Enter or a click adds it to the tag, Tab completes the text';
        chip.append(el('span', 'l', i.label));
        if (i.orig) chip.append(el('span', 're', 're-add'));
        chip.addEventListener('mousedown', e => { e.preventDefault(); addItem(si, ii); });
        s.sugEls.append(chip);
      });
      s.sugList = sugs;
      if (focused) reveal(si);
      if (!confirming) help.update();   // also on blur: the suggestion hint goes away with the focus
    }

    function refresh(si) { renderChips(si); renderAdd(si); updatePend(si); if (!S[si].readonly) renderUntagged(); updateFooter(); }

    // keep (Enter, from the field or inside the row, unless the added label equals the typed text): the typed text and the list stay, the added track leaves the list and the
    // highlight lands on the next suggestion (the previous one after the last); an empty list returns to the field.
    function addItem(si, ii, keep) {
      const s = S[si];
      setFold(si, false);   // the chip just added must be in view
      s.items[ii].cur = true;
      if (!s.items[ii].orig) { s.added = s.added.filter(x => x !== ii); s.added.push(ii); }
      // An exact name (case-insensitive, with or without the leading /) means the user meant just that one: the field clears.
      const norm = x => x.trim().toLowerCase().replace(/^\//, '');
      if (keep && norm(s.q) === norm(s.items[ii].label)) keep = false;
      if (keep) {
        const left = suggestions(s).length;
        s.hi = Math.min(s.hi, Math.max(left - 1, 0));
        if (!left) s.sel = false;
      } else {
        s.q = ''; s.hi = 0; s.sel = false;
        s.inputEl.value = '';
      }
      clearNoMatch(s);
      refresh(si);
    }

    function noMatch(s) {
      if (!s.noEl) { s.noEl = el('span', 'nomatch', 'no match'); s.addEl.after(s.noEl); }
      s.inputEl.classList.remove('shake'); void s.inputEl.offsetWidth; s.inputEl.classList.add('shake');
    }
    function clearNoMatch(s) { s.noEl?.remove(); s.noEl = null; }

    function buildSection(si) {
      const s = S[si];
      s.el = el('div', 'sec' + (s.readonly ? ' ro' : ''));
      const head = el('div', 'head');
      s.headEl = head;
      head.dataset.help = s.readonly ? 'Untagged: tracks without a tag. Click the heading to fold it, click a track to add it to the target tag' : 'Tag: → opens it and goes to its add field, ← folds it, ↑↓ move between tags' + (s.renamable ? ', F2 renames' : '');
      s.nameEl = el('span', 'h');
      s.hashEl = el('span', 'hash');
      s.nmEl = el('span', 'nm' + (s.renamable ? ' edit' : ''));
      s.nameEl.append(s.hashEl, s.nmEl);
      if (s.renamable) {
        s.nmEl.setAttribute('aria-label', 'Click to rename (F2)');
        s.nmEl.addEventListener('mousedown', e => e.preventDefault());
        s.nmEl.addEventListener('click', () => startRename(si));
      }
      s.markEl = el('span', 'renamed');
      if (s.readonly) {   // folds: "▸ untagged · 37 tracks", collapsed until the heading is clicked (or Enter / Space)
        s.folded = true;
        s.caretEl = el('span', 'caret', '▸');
        head.append(s.caretEl, s.nameEl, s.markEl);
        if (s.meta) { s.metaEl = el('span', 'meta inl', '· ' + s.meta); head.append(s.metaEl); }
        head.tabIndex = 0;
        head.setAttribute('role', 'button');
        head.addEventListener('click', () => toggleFold(si));
        head.setAttribute('aria-label', 'Fold / unfold · ↓ picks tracks, Enter adds the one under the cursor to the active tag');
        head.addEventListener('keydown', e => {
          if (e.target !== head) return;
          if (s.cc != null) { keyOnUntagged(e, si); return; }
          const stop = () => { e.preventDefault(); e.stopPropagation(); };
          const enter = () => { const idx = chipIdx(s); if (idx.length) { s.cc = idx[0]; renderChips(si); revealCursor(si); } };
          if (e.key === ' ') { stop(); toggleFold(si); }
          else if (e.key === 'Enter') { stop(); setFold(si, false); enter(); }   // opens and steps to the first track
          else if (e.key === 'ArrowRight') { stop(); if (s.folded) setFold(si, false); else enter(); }   // → opens, again steps into the tracks
          else if (e.key === 'ArrowLeft') { stop(); setFold(si, true); }
          else if (e.key === 'ArrowUp') { stop(); moveHead(head, -1); }
          else if (e.key === 'ArrowDown') stop();   // the last heading
        });
        head.addEventListener('blur', () => { if (s.cc != null) { s.cc = null; renderChips(si); } });
      } else {
        // a tag folds too: open by default, folded from FOLD_AFTER tracks; the add field and the count stay in the heading
        s.folded = s.items.filter(i => i.orig).length > FOLD_AFTER;
        s.caretEl = el('button', 'fold', s.folded ? '▸' : '▾');
        s.caretEl.dataset.help = 'Fold: show or hide this tag\'s tracks';
        s.caretEl.type = 'button'; s.caretEl.tabIndex = -1; s.caretEl.setAttribute('aria-label', 'Fold / unfold the tracks (← → on the heading)');
        s.caretEl.addEventListener('mousedown', e => e.preventDefault());
        s.caretEl.addEventListener('click', () => toggleFold(si));
        head.append(s.caretEl, s.nameEl, s.markEl);
        if (s.meta) { s.metaEl = el('span', 'meta push', s.meta); head.append(s.metaEl); }
      }
      if (s.removable) {
        s.rmBtn = el('button', 'act' + (s.meta ? '' : ' push'), '×');
        s.rmBtn.dataset.help = 'Remove tag: mark the whole tag for removal (⇧⌫), click again to undo';
        s.rmBtn.type = 'button'; s.rmBtn.setAttribute('aria-label', 'Remove the whole tag (⇧⌫)');
        s.rmBtn.addEventListener('mousedown', e => e.preventDefault());
        s.rmBtn.addEventListener('click', () => toggleRemoveAll(si));
        head.append(s.rmBtn);
      }
      s.chipsEl = el('div', 'chips');
      s.chipsEl.hidden = !!s.folded;   // a read-only section always starts folded, a long tag too
      s.el.append(head, s.chipsEl);
      if (!s.readonly) {
        s.addEl = el('span', 'addwrap');
        s.ghostEl = el('span', 'ghost');
        s.inputEl = el('input');
        s.inputEl.type = 'text';
        s.inputEl.dataset.help = 'Add track: type a track name, Enter adds it to this tag';
        s.inputEl.placeholder = addPlaceholder(s);
        s.inputEl.autocomplete = 'off';
        s.inputEl.spellcheck = false;
        s.addEl.append(s.ghostEl, s.inputEl);
        head.tabIndex = -1;   // reached by ↑/↓ (no Tab stop): → unfolds, then goes into the field; ← folds; F2 renames
        head.addEventListener('keydown', e => {
          if (e.target !== head) return;
          const stop = () => { e.preventDefault(); e.stopPropagation(); };
          if (e.key === 'ArrowRight') { stop(); if (s.folded) setFold(si, false); else caretToEnd(s.inputEl); }   // → opens; open: into the add field
          else if (e.key === 'ArrowLeft') { stop(); setFold(si, true); }
          else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { stop(); moveHead(head, e.key === 'ArrowDown' ? 1 : -1); }
          else if (e.key === ' ') { stop(); toggleFold(si); }
          else if (e.key === 'Enter') { stop(); setFold(si, false); caretToEnd(s.inputEl); }   // opens (if folded) and goes into the field: the tag becomes the target
          else if (e.key === 'F2' && s.renamable) { stop(); startRename(si); }
          else if (e.key === 'Backspace' && e.shiftKey && s.removable) { stop(); toggleRemoveAll(si); }
        });
        s.pendEl = el('span', 'pend');
        head.insertBefore(s.addEl, s.metaEl ?? s.rmBtn ?? null);
        head.insertBefore(s.pendEl, s.metaEl ?? s.rmBtn ?? null);
        s.sugEls = el('div', 'sugs');
        s.el.insertBefore(s.sugEls, s.chipsEl);
        s.inputEl.addEventListener('input', () => { s.q = s.inputEl.value; s.hi = 0; s.sel = false; clearNoMatch(s); renderAdd(si); });
        s.inputEl.addEventListener('focus', () => { setTarget(si); renderAdd(si); });
        s.inputEl.addEventListener('blur', () => { s.sel = false; renderAdd(si); if (s.cc != null) { s.cc = null; renderChips(si); } });
        s.inputEl.addEventListener('keydown', e => keyInSection(e, si));
        // A click anywhere in the section (not on a chip) puts the caret in its input.
        s.el.addEventListener('mousedown', e => { if (!e.target.closest('.chip') && e.target !== s.inputEl) { e.preventDefault(); s.inputEl.focus(); } });
      }
      sectionsBox.append(s.el);
      refreshHead(si);
      renderChips(si);
      if (!s.readonly) { renderAdd(si); updatePend(si); }
    }

    // ---- whole-tag actions: rename (inline input in the heading) and remove (marked, struck through) ----
    // The name as shown: what was typed, with the heading's leading "#" kept.
    function shownName(s) {
      if (s.rename === null) return s.heading;
      return s.heading.startsWith('#') && !s.rename.startsWith('#') ? '#' + s.rename : s.rename;
    }
    // The add field says which tag it adds to: "+ add track to #drums…" (the shown name, so a rename shows too).
    const addPlaceholder = s => '+ add track to ' + shownName(s) + '…';
    function refreshHead(si) {
      const s = S[si];
      if (!s.nmEl) return;
      const shown = shownName(s), hashed = shown.startsWith('#');
      s.hashEl.textContent = hashed ? '#' : '';
      s.nmEl.textContent = hashed ? shown.slice(1) : shown;
      s.markEl.textContent = s.rename !== null && !s.removeAll ? '(was ' + s.heading + ')' : '';
      s.el.classList.toggle('gone', s.removeAll);
      if (target === si) { renderUntagged(); updateFooter(); }
      s.rmBtn?.classList.toggle('on', s.removeAll);
      if (s.inputEl) { s.inputEl.placeholder = addPlaceholder(s); renderAdd(si); }
    }
    function toggleRemoveAll(si) {
      const s = S[si];
      if (!s.removable) return;
      s.removeAll = !s.removeAll;
      refreshHead(si);
      updatePend(si);
      renderUntagged();   // a tag marked for removal sends no additions: its pending tracks show under untagged again
      updateFooter();
    }
    const isValidTagName = name => !!name && (BOARD?.create?.pattern ? validName(name) : true);
    function startRename(si) {
      const s = S[si];
      if (!s.renamable || s.renaming || s.removeAll) return;
      s.renaming = true;
      const input = el('input', 'rn');
      input.type = 'text'; input.autocomplete = 'off'; input.spellcheck = false;
      input.value = shownName(s).replace(/^#/, '');   // the # stays outside the edit
      input.style.width = 'calc(' + Math.max(8, input.value.length + 2) + 'ch + 10px)';
      const err = el('span', 'rnerr');
      s.nmEl.replaceWith(input);
      input.after(err);
      const done = (commit) => {

        }

      const bare0 = t => t.replace(/^#/, '');
      s.draftOk = () => { const n = input.value.trim(); return bare0(n) !== bare0(shownName(s)) && isValidTagName(n); };

      input.addEventListener('keydown', e => {
        e.stopPropagation();   // the board's own keys stay out of the edit

    }

    function setFold(si, folded) {
      const s = S[si];
      if (!s.chipsEl || !!s.folded === folded) return;

    // A folded tag hides its chips, so the heading says what is pending inside: "+2" added, "×1" marked for removal.
    function updatePend(si) {
      const s = S[si];
      if (!s.pendEl) return;
      const add = s.items.filter(i => i.cur && !i.orig).length, rm = s.items.filter(i => i.orig && !i.cur).length;
      s.pendEl.textContent = s.folded ? [add ? '+' + add : '', rm ? '×' + rm : ''].filter(Boolean).join(' ') : '';

      const dying = !s.removeAll && !s.created && s.items.some(i => i.orig) && !s.items.some(i => i.cur);

    // ---- focus order: the sections' inputs, then the create input ---------------------------
    const createBox = document.getElementById('create');
    let createInput = null, createErr = null, createWrap = null;
    // Focus order = the order drawn: the pinned create input, created sections (newest on top), the others.
    function inputs() {

      const idx = S.map((_, si) => si).filter(si => !S[si].readonly);

    // The first section's input (the create row is above it): where the focus starts and typing goes.
    const firstInput = () => inputs().find(x => x.si !== -1) ?? inputs()[0];
    // Headings, top to bottom: the New tag field, then every section's heading. ↑/↓ walk only these; → goes deeper
    // (heading → add field → chips), ← back out. The add field and the chips are no stops of ↑/↓.
    function headingList() {

      buildSection(si);
      sectionsBox.prepend(S[si].el);   // directly below the pinned row, not at the end
      // The tracks collected while this field was the target go into the new tag (dashed ring, like typed ones).
      const ns = S[si];
      for (const id of collected.splice(0)) { const ii = ns.items.findIndex(i => i.id === id); if (ii >= 0) { ns.items[ii].cur = true; ns.added.push(ii); } }

    // ---- keys ------------------------------------------------------------------------------
    // The chip cursor (s.cc = an item index, DOM focus stays in the input): ←/→ step through the

    function keyOnChip(e, si) {

    function keyInSection(e, si) {
      const s = S[si];

      if (e.key === 'F2' && s.renamable) { e.preventDefault(); startRename(si); return; }
      if (e.key === 'Backspace' && e.shiftKey && !s.inputEl.value && s.removable) { e.preventDefault(); toggleRemoveAll(si); return; }

      const plain = !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey;

      // The suggestion row is a selection of its own: → from the field (caret at the end, suggestions showing) enters it on

      }
      if (e.key === 'Enter') {
        e.preventDefault();

      } else if (e.key === 'Tab' && !e.shiftKey && s.inputEl.value) {

        e.preventDefault();
        const sugs = s.sugList ?? [];
        if (!sugs.length) { noMatch(s); return; }
        const ii = sugs[s.hi];
        s.q = s.inputEl.value = s.items[ii].label;

      }
    }
    function keyOnCollected(e) {
      const at = collected.indexOf(ccNew);
      const leave = () => { ccNew = null; renderCollected(); };
      if (e.key === 'ArrowLeft') { e.preventDefault(); if (at > 0) { ccNew = collected[at - 1]; renderCollected(); } else { leave(); caretToEnd(createInput); } }

    function keyInCreate(e) {

      if (e.key === 'ArrowRight' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey && collected.length

      document.getElementById('confirmNo').addEventListener('click', () => cancelConfirm());
      document.getElementById('confirmYes').addEventListener('click', () => onConfirmYes?.());

      gearEl.hidden = BOARD.gear !== true;
      // The gear answers { settings: true } and nothing else; core opens the settings and then the board again.
      gearEl.addEventListener('click', () => {
        const n = pending() || (collected.length ? 1 : 0);
        if (!n) { send(JSON.stringify({ settings: true })); return; }
        showConfirm('Discard ' + n + ' change' + (n === 1 ? '' : 's') + ' and open settings?', 'Discard and open settings', () => send(JSON.stringify({ settings: true })));
      });
      confirmBox.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cancelConfirm(); } });
      document.getElementById('close').addEventListener('click', requestClose);
      scroll.tabIndex = -1;
      createBox.classList.toggle('target', target === -1 && !!createInput);
      const first = createInput ? { input: createInput } : firstInput();   // opens in the New tag field
      if (first) first.input.focus({ preventScroll: true }); else scroll.focus();   // opens at the top, whatever the first section holds
      scroll.scrollTop = 0;
      requestAnimationFrame(() => { if (!touched) scroll.scrollTop = 0; });
      window.addEventListener('load', () => { if (!touched) scroll.scrollTop = 0; });
    });
  </script>
