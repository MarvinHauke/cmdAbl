<!DOCTYPE html>
<!-- board surface (see src/core/ui.ts BoardRequest, plan 0010). In: BOARD_PLACEHOLDER = { title, sections: [{ id, heading, meta?, items: [{ id, label, on }], readonly? }], create?: { label, pattern? }, apply: { label } }. A section shows its on items as chips with × (a click marks one for removal: struck through with an accent outline; another click unmarks it) and, after them, an inline input ("add…", like the tag bar in Live's browser): typing searches the section's items that are not on (or are pending removal), best match as ghost text plus up to 6 suggestion chips (←/→/↑/↓ move the highlight while they show); Tab puts the highlighted one into the input (stays in the field; on an empty input Tab leaves it as usual), Enter adds the highlighted one as a chip with a dashed accent ring. ←/→ in an empty input (or at caret 0) put a chip cursor on the section's chips: Backspace/Delete/Space toggle the removal mark of the chip under it, typing/Esc/Tab return to the input, Enter applies. A readonly section shows chips only. create adds an empty section from an input at the bottom (name checked against pattern, a regular expression the whole name must match). A created section with nothing added sends nothing. Out (close_and_send): '' when closed (Close, Esc; with pending changes the first one only warns in the footer, the second discards), or JSON { changes: [{ section, item, on }], created: [names] } on Apply: only real differences against the request; a created section's id is its name and its items start off. Text goes in with textContent only (headings and labels are user data). The board's title is not drawn: the dialog already names the command. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <title>cmdAbl</title>
  <style>
    /*SHARED_CSS_PLACEHOLDER*/

    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    #scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 10px 12px 8px; }
    #scroll:focus { outline: none; }

    /* One section: heading line (heading, meta right), then chips with the add input last. */
    .sec + .sec { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
    .head { display: flex; align-items: baseline; gap: 8px; padding: 2px 0; }
    .head .h { color: var(--accent); font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
    .head .meta { margin-left: auto; flex: none; color: var(--dim); font-size: 11px; }
    .sec.ro .head .h { color: var(--dim); }

    .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 4px; }
    .chip { display: inline-flex; align-items: baseline; gap: 6px; background: var(--bg-row); border: 1px solid var(--border);
            border-radius: 2px; padding: 0 6px; line-height: 18px; overflow-wrap: anywhere; min-width: 0; cursor: default; }
    .chip .x { color: var(--dim); font-size: 11px; user-select: none; }
    .chip:hover .x { color: var(--text); }
    /* Marked for removal: struck through with an accent outline. Added (not in Live yet): dashed accent ring. */
    .chip.rm { text-decoration: line-through; color: var(--dim); outline: 1px solid var(--accent); outline-offset: 1px; }
    .chip.add { outline: 1px dashed var(--accent); outline-offset: 1px; }
    /* The chip cursor (← / → in the add input): a tint and an accent underline; the input caret hides. */
    .chip.cur { background: hsla(31, 100%, 67%, 0.22); box-shadow: inset 0 -2px 0 var(--accent); }
    .addwrap.chipmode input { caret-color: transparent; }
    .none { color: var(--dim); font-size: 11px; line-height: 20px; }

    /* The inline input is the last "chip": a dashed outline, ghost text behind the typed text. */
    .addwrap { position: relative; display: inline-block; }
    .addwrap input { position: relative; z-index: 1; box-sizing: border-box; background: transparent; border: 1px dashed var(--dim); border-radius: 2px;
                     outline: none; color: var(--text); font: inherit; line-height: 16px; padding: 0 6px; caret-color: var(--accent); }
    .addwrap input:focus { border-color: var(--accent); }
    .addwrap input::placeholder { color: var(--dim); }
    .ghost { position: absolute; left: 7px; top: 1px; line-height: 16px; white-space: pre; pointer-events: none; color: var(--dim); }
    .ghost .typed { visibility: hidden; }
    .nomatch { color: var(--accent); font-size: 11px; }
    .shake { animation: shake 0.25s; }
    @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

    /* Suggestions under the chips (focused section only): the highlighted one has an accent border. */
    .sugs { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 5px; }
    .sugs:empty { display: none; }
    .chip.sug { cursor: default; color: var(--text); }
    .chip.sug.hi { border-color: var(--accent); color: var(--accent); }
    .chip.sug .re { color: var(--dim); font-size: 11px; }

    /* The create entry at the bottom. */
    #create { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    #create .plus { color: var(--accent); font-weight: 700; user-select: none; }
    #create[hidden] { display: none; }

    #footer { flex-shrink: 0; border-top: 1px solid var(--border); padding: 6px 12px; display: flex; align-items: center; gap: 8px; }
    #hint { flex: 1; min-width: 0; color: var(--dim); font-size: 10px; line-height: 13px; }
    #apply { flex: none; border-color: var(--accent); color: var(--accent); }
    #apply:disabled { border-color: var(--dim); color: var(--dim); opacity: 0.5; cursor: default; }
    #close { flex: none; }
  </style>
</head>
<body>

  <div id="scroll">
    <div id="sections"></div>
    <div id="create" hidden></div>
  </div>
  <div id="footer">
    <span id="hint">type to add · ←→↑↓ pick · Tab accept · Enter add · ← chips · ⌫ remove · ↑↓ move · Enter = apply · Esc</span>
    <button id="apply" disabled></button>
    <button id="close">Close</button>
  </div>

  <script>
    // Injected by the extension: see the contract at the top.
    const BOARD = /*BOARD_PLACEHOLDER*/null;

    function send(value) {
      const m = { method: 'close_and_send', params: [value] };
      if (window.webkit?.messageHandlers?.live) window.webkit.messageHandlers.live.postMessage(m);
      else if (window.chrome?.webview) window.chrome.webview.postMessage(m);
    }

    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;   // user data: textContent only
      return e;
    };

    // ---- model ---------------------------------------------------------------------------
    // orig = the state in the request; cur = the pending state. `added` = item indexes turned on
    // here, in the order added (their chips follow the section's own chips).
    const S = (BOARD?.sections ?? []).map(s => ({
      id: s.id, heading: s.heading, meta: s.meta, readonly: !!s.readonly, created: false, q: '', hi: 0, added: [], cc: null,
      items: (s.items ?? []).map(i => ({ id: i.id, label: i.label ?? i.id, orig: !!i.on, cur: !!i.on })),
    }));
    // A created section can carry any item the request names (first label wins), all off.
    const candidates = [];
    { const seen = new Set();
      for (const s of S) for (const i of s.items) if (!seen.has(i.id)) { seen.add(i.id); candidates.push({ id: i.id, label: i.label }); } }

    function changes() {
      const out = [];
      for (const s of S) {
        if (s.readonly) continue;
        for (const i of s.items) if (i.cur !== i.orig) out.push({ section: s.id, item: i.id, on: i.cur });
      }
      return out;
    }
    function createdNames() { return S.filter(s => s.created && s.items.some(i => i.cur)).map(s => s.id); }

    // Esc or Close with pending changes warns first (footer); a second Esc or Close discards,
    // any other key cancels the warning. Without changes it closes at once.
    const hintEl = document.getElementById('hint');
    const defaultHint = hintEl.textContent;
    let armed = false;
    function disarm() { if (!armed) return; armed = false; hintEl.textContent = defaultHint; hintEl.style.color = ''; }
    function requestClose() {
      const n = changes().length;
      if (n && !armed) {
        armed = true;
        hintEl.textContent = n + ' change' + (n === 1 ? '' : 's') + ' not applied — Esc again to discard';
        hintEl.style.color = 'var(--accent)';
        return;
      }
      send('');
    }
    document.addEventListener('keydown', e => {
      if (armed && e.key !== 'Escape' && !['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) disarm();
    }, true);
    // A click anywhere but on Close also cancels the warning (the count shown would be stale).
    document.addEventListener('mousedown', e => { if (!(e.target instanceof Element && e.target.closest('#close'))) disarm(); }, true);

    function apply() {
      const list = changes();
      if (!list.length) return;
      send(JSON.stringify({ changes: list, created: createdNames() }));
    }

    // The chips of a section in display order: its own on items (marked ones stay, struck), then
    // the ones added here in the order added.
    function chipIdx(s) {
      const out = [];
      s.items.forEach((i, ii) => { if (i.orig) out.push(ii); });
      for (const ii of s.added) if (s.items[ii].cur) out.push(ii);
      return out;
    }

    function toggleItem(si, ii) {
      const s = S[si];
      if (s.readonly) return;
      const i = s.items[ii];
      i.cur = !i.cur;
      if (!i.orig) { s.added = s.added.filter(x => x !== ii); if (i.cur) s.added.push(ii); }
      refresh(si);
    }

    // ---- search ----------------------------------------------------------------------------
    // Candidates: items not on now (so also those marked for removal). Start of name first
    // (with or without the leading "/"), then start of the last path part, then anywhere.
    function rank(label, q) {
      const l = label.toLowerCase();
      if (l.startsWith(q) || l.replace(/^\//, '').startsWith(q)) return 0;
      if (l.slice(l.lastIndexOf('/') + 1).startsWith(q)) return 1;
      return l.includes(q) ? 2 : -1;
    }
    function suggestions(s) {
      const q = s.q.trim().toLowerCase();
      if (!q) return [];
      const out = [];
      s.items.forEach((i, ii) => {
        if (i.cur) return;
        const r = rank(i.label, q);
        const l = i.label.toLowerCase();
        if (r >= 0) out.push({ ii, r, exact: l === q || l.replace(/^\//, '') === q ? 0 : 1 });
      });
      out.sort((a, b) => a.r - b.r || a.exact - b.exact || a.ii - b.ii);   // an exact name first, so it survives the cap
      return out.slice(0, 6).map(o => o.ii);
    }
    // The ghost: the rest of the highlighted label, only when what was typed is a prefix of it.
    function ghostRest(label, q) {
      if (!q) return '';
      const l = label.toLowerCase(), lq = q.toLowerCase();
      if (l.startsWith(lq)) return label.slice(q.length);
      if (l.startsWith('/') && !lq.startsWith('/') && l.slice(1).startsWith(lq)) return label.slice(1 + q.length);
      return '';
    }

    // ---- rendering -------------------------------------------------------------------------
    const sectionsBox = document.getElementById('sections');
    const scroll = document.getElementById('scroll');
    const applyBtn = document.getElementById('apply');

    function updateFooter() {
      const n = changes().length;
      applyBtn.textContent = (BOARD?.apply?.label || 'Apply') + ' (' + n + ' change' + (n === 1 ? '' : 's') + ')';
      applyBtn.disabled = n === 0;
    }

    function renderChips(si) {
      const s = S[si];
      for (const c of [...s.chipsEl.querySelectorAll('.chip, .none')]) c.remove();
      const idx = chipIdx(s);
      if (s.cc != null && !idx.includes(s.cc)) s.cc = null;
      s.addEl?.classList.toggle('chipmode', s.cc != null);
      for (const ii of idx) {
        const i = s.items[ii];
        const chip = el('span', 'chip' + (i.orig && !i.cur ? ' rm' : '') + (!i.orig && i.cur ? ' add' : '') + (ii === s.cc ? ' cur' : ''));
        chip.append(el('span', 'l', i.label));
        if (!s.readonly) {
          chip.append(el('span', 'x', '×'));
          chip.title = i.orig && !i.cur ? 'marked for removal (click to undo)' : !i.orig && i.cur ? 'to be added (click to undo)' : 'click to remove';
          chip.addEventListener('mousedown', e => { e.preventDefault(); toggleItem(si, ii); });
        }
        s.chipsEl.insertBefore(chip, s.addEl ?? null);
      }
      if (!idx.length && s.readonly) s.chipsEl.append(el('span', 'none', 'none'));
    }

    // Input width follows the typed text plus ghost; suggestions only for the focused section.
    function renderAdd(si) {
      const s = S[si];
      if (s.readonly) return;
      const sugs = suggestions(s);
      s.hi = Math.min(s.hi, Math.max(sugs.length - 1, 0));
      const focused = document.activeElement === s.inputEl;
      const best = sugs.length ? s.items[sugs[s.hi]].label : '';
      const rest = ghostRest(best, s.q);
      s.ghostEl.replaceChildren(el('span', 'typed', s.q), document.createTextNode(rest));
      s.inputEl.style.width = 'calc(' + Math.max(6, s.q.length + rest.length + 1) + 'ch + 14px)';
      s.rest = rest;
      s.sugEls.replaceChildren();
      if (focused) sugs.forEach((ii, k) => {
        const i = s.items[ii];
        const chip = el('span', 'chip sug' + (k === s.hi ? ' hi' : ''));
        chip.append(el('span', 'l', i.label));
        if (i.orig) chip.append(el('span', 're', 're-add'));
        chip.addEventListener('mousedown', e => { e.preventDefault(); addItem(si, ii); });
        s.sugEls.append(chip);
      });
      s.sugList = sugs;
    }

    function refresh(si) { renderChips(si); renderAdd(si); updateFooter(); }

    function addItem(si, ii) {
      const s = S[si];
      s.items[ii].cur = true;
      if (!s.items[ii].orig) { s.added = s.added.filter(x => x !== ii); s.added.push(ii); }
      s.q = ''; s.hi = 0;
      s.inputEl.value = '';
      clearNoMatch(s);
      refresh(si);
      s.inputEl.scrollIntoView({ block: 'nearest' });
    }

    function noMatch(s) {
      if (!s.noEl) { s.noEl = el('span', 'nomatch', 'no match'); s.addEl.after(s.noEl); }
      s.inputEl.classList.remove('shake'); void s.inputEl.offsetWidth; s.inputEl.classList.add('shake');
    }
    function clearNoMatch(s) { s.noEl?.remove(); s.noEl = null; }

    function buildSection(si) {
      const s = S[si];
      s.el = el('div', 'sec' + (s.readonly ? ' ro' : ''));
      const head = el('div', 'head');
      head.append(el('span', 'h', s.heading));
      if (s.meta) head.append(el('span', 'meta', s.meta));
      s.chipsEl = el('div', 'chips');
      s.el.append(head, s.chipsEl);
      if (!s.readonly) {
        s.addEl = el('span', 'addwrap');
        s.ghostEl = el('span', 'ghost');
        s.inputEl = el('input');
        s.inputEl.type = 'text';
        s.inputEl.placeholder = 'add…';
        s.inputEl.autocomplete = 'off';
        s.inputEl.spellcheck = false;
        s.addEl.append(s.ghostEl, s.inputEl);
        s.chipsEl.append(s.addEl);
        s.sugEls = el('div', 'sugs');
        s.el.append(s.sugEls);
        s.inputEl.addEventListener('input', () => { s.q = s.inputEl.value; s.hi = 0; clearNoMatch(s); renderAdd(si); });
        s.inputEl.addEventListener('focus', () => renderAdd(si));
        s.inputEl.addEventListener('blur', () => { renderAdd(si); if (s.cc != null) { s.cc = null; renderChips(si); } });
        s.inputEl.addEventListener('keydown', e => keyInSection(e, si));
        // A click anywhere in the section (not on a chip) puts the caret in its input.
        s.el.addEventListener('mousedown', e => { if (!e.target.closest('.chip') && e.target !== s.inputEl) { e.preventDefault(); s.inputEl.focus(); } });
      }
      sectionsBox.append(s.el);
      renderChips(si);
      if (!s.readonly) renderAdd(si);
    }

    // ---- focus order: the sections' inputs, then the create input ---------------------------
    const createBox = document.getElementById('create');
    let createInput = null, createErr = null;
    function inputs() {
      const out = [];
      S.forEach((s, si) => { if (!s.readonly) out.push({ si, input: s.inputEl }); });
      if (createInput) out.push({ si: -1, input: createInput });
      return out;
    }
    function jump(from, delta) {
      const list = inputs();
      const at = list.findIndex(x => x.si === from);
      const next = list[Math.max(0, Math.min(list.length - 1, at + delta))];
      if (next) { next.input.focus(); next.input.scrollIntoView({ block: 'nearest' }); }
    }

    // ---- the create entry ------------------------------------------------------------------
    function buildCreate() {
      if (!BOARD?.create) return;
      createBox.hidden = false;
      createInput = el('input');
      createInput.type = 'text';
      createInput.placeholder = BOARD.create.label;
      createInput.autocomplete = 'off';
      createInput.spellcheck = false;
      const wrap = el('span', 'addwrap');
      wrap.append(createInput);
      createInput.style.width = 'calc(' + Math.max(12, BOARD.create.label.length + 1) + 'ch + 14px)';
      createErr = el('span', 'nomatch');
      createErr.hidden = true;
      createBox.append(el('span', 'plus', '⊕'), wrap, createErr);
      createInput.addEventListener('input', () => {
        createErr.hidden = true;
        createInput.style.width = 'calc(' + Math.max(12, BOARD.create.label.length + 1, createInput.value.length + 1) + 'ch + 14px)';
      });
      createInput.addEventListener('keydown', e => keyInCreate(e));
    }
    // A name must fully match pattern (a regular expression); a bad name shows a hint and is not added.
    function validName(name) {
      const pattern = BOARD.create.pattern;
      if (!pattern) return true;
      try { return new RegExp('^(?:' + pattern + ')$').test(name); } catch { return false; }
    }
    function submitCreate() {
      const name = createInput.value.trim();
      if (!name) return;
      // Same as an existing section: by id, or by heading ignoring case and a leading "#".
      const norm = t => t.trim().replace(/^#/, '').toLowerCase();
      const hint = text => { createErr.textContent = text; createErr.hidden = false; createInput.classList.remove('shake'); void createInput.offsetWidth; createInput.classList.add('shake'); };
      if (S.some(s => s.id === name || norm(s.heading) === norm(name))) { hint('exists already'); return; }
      if (!validName(name)) { hint('not a valid name'); return; }
      S.push({ id: name, heading: name, meta: undefined, readonly: false, created: true, q: '', hi: 0, added: [], cc: null,
               items: candidates.map(c => ({ id: c.id, label: c.label, orig: false, cur: false })) });
      createInput.value = '';
      createInput.dispatchEvent(new Event('input'));
      const si = S.length - 1;
      buildSection(si);
      S[si].inputEl.focus();   // a new section: type to add a track
      S[si].inputEl.scrollIntoView({ block: 'nearest' });
    }

    // ---- keys ------------------------------------------------------------------------------
    // The chip cursor (s.cc = an item index, DOM focus stays in the input): ←/→ step through the
    // chips, Backspace/Delete/Space toggle the mark, typing or Esc/Tab return to the input.
    function keyOnChip(e, si) {
      const s = S[si];
      const idx = chipIdx(s);
      const at = idx.indexOf(s.cc);
      const leave = () => { s.cc = null; renderChips(si); };
      if (e.key === 'ArrowLeft') { e.preventDefault(); if (at > 0) { s.cc = idx[at - 1]; renderChips(si); } }
      else if (e.key === 'ArrowRight') { e.preventDefault(); if (at < idx.length - 1) { s.cc = idx[at + 1]; renderChips(si); } else leave(); }
      else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === ' ') {
        e.preventDefault();
        const ii = s.cc;
        toggleItem(si, ii);
        if (!chipIdx(s).includes(ii)) { s.cc = idx[at - 1] ?? null; renderChips(si); }   // an added chip vanished: previous chip, else the input
      }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); leave(); jump(si, e.key === 'ArrowDown' ? 1 : -1); }
      else if (e.key === 'Enter') { e.preventDefault(); if (!e.repeat && !s.inputEl.value.trim()) apply(); }   // nothing typed to add: Enter applies (no changes: nothing)
      else if (e.key === 'Escape') { e.preventDefault(); leave(); }
      else if (e.key === 'Tab') { e.preventDefault(); leave(); }
      else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) leave();   // not prevented: the key is typed in the input
    }

    function keyInSection(e, si) {
      const s = S[si];
      if (s.cc != null) { keyOnChip(e, si); return; }
      // While suggestions show, plain ←/→ move the highlight (previous/next, no wrap) instead of the caret
      // or the chips; Cmd/Alt/Ctrl+←/→, Home and End stay native.
      if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey
          && s.inputEl.value && (s.sugList?.length ?? 0) > 0) {
        e.preventDefault();
        const next = Math.max(0, Math.min(s.sugList.length - 1, s.hi + (e.key === 'ArrowRight' ? 1 : -1)));
        if (next !== s.hi) { s.hi = next; renderAdd(si); }
        return;
      }
      if (e.key === 'ArrowLeft' && !e.shiftKey && s.inputEl.selectionStart === 0 && s.inputEl.selectionEnd === 0) {
        const idx = chipIdx(s);
        if (idx.length) { e.preventDefault(); s.cc = idx[idx.length - 1]; renderChips(si); }
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (e.repeat) return;   // a held Enter from the dialog before must not apply
        if (!s.q.trim()) { apply(); return; }
        const sugs = s.sugList ?? [];
        if (sugs.length) addItem(si, sugs[s.hi]); else noMatch(s);
      } else if (e.key === 'Tab' && !e.shiftKey && s.inputEl.value) {
        // Tab accepts: the highlighted suggestion's label goes into the input (caret at the end) and the
        // field keeps focus, so Enter then adds it. With ghost text or without. No match: shake, stay.
        // An empty input (or Shift+Tab) leaves the field as the browser does.
        e.preventDefault();
        const sugs = s.sugList ?? [];
        if (!sugs.length) { noMatch(s); return; }
        const ii = sugs[s.hi];
        s.q = s.inputEl.value = s.items[ii].label;
        s.hi = Math.max(0, suggestions(s).indexOf(ii));   // keep the accepted one highlighted
        renderAdd(si);
      } else if (e.key === 'Backspace' && !s.inputEl.value) {
        e.preventDefault();
        const idx = chipIdx(s);
        if (idx.length) toggleItem(si, idx[idx.length - 1]);   // mark the last chip; again unmarks it; an added one disappears
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || (e.ctrlKey && (e.key === 'n' || e.key === 'p'))) {
        e.preventDefault();
        const delta = (e.key === 'ArrowDown' || e.key === 'n') ? 1 : -1;
        const sugs = s.sugList ?? [];
        if (sugs.length) { s.hi = (s.hi + delta + sugs.length) % sugs.length; renderAdd(si); }
        else jump(si, delta);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        if (s.inputEl.value) { s.q = s.inputEl.value = ''; s.hi = 0; clearNoMatch(s); renderAdd(si); } else requestClose();
      }
    }
    function keyInCreate(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (e.repeat) return;
        if (createInput.value.trim()) submitCreate(); else apply();
      } else if (e.key === 'Tab' && !e.shiftKey && createInput.value) {
        e.preventDefault();   // no suggestions here: stay in the field
        createInput.classList.remove('shake'); void createInput.offsetWidth; createInput.classList.add('shake');
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        jump(-1, e.key === 'ArrowDown' ? 1 : -1);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        if (createInput.value) { createInput.value = ''; createInput.dispatchEvent(new Event('input')); } else requestClose();
      }
    }
    // Focus on nothing (after a click on a button): Esc closes, Enter applies.
    document.addEventListener('keydown', e => {
      if (e.target instanceof HTMLInputElement || e.target instanceof HTMLButtonElement || e.repeat) return;
      if (e.key === 'Escape') { e.preventDefault(); requestClose(); }
      else if (e.key === 'Enter') { e.preventDefault(); apply(); }
      else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) inputs()[0]?.input.focus();   // typing starts the first input
    });

    document.addEventListener('DOMContentLoaded', () => {
      S.forEach((_, si) => buildSection(si));
      buildCreate();
      updateFooter();
      document.getElementById('apply').addEventListener('click', apply);
      document.getElementById('close').addEventListener('click', requestClose);
      scroll.tabIndex = -1;
      const first = inputs()[0];
      if (first) first.input.focus({ preventScroll: true }); else scroll.focus();   // opens at the top, whatever the first section holds
    });
  </script>

</body>
</html>
