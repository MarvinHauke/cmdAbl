site_name: cmdAbl
site_description: A command palette for Ableton Live
site_url: https://marvinhauke.github.io/cmdAbl/
repo_url: https://github.com/MarvinHauke/cmdAbl
repo_name: MarvinHauke/cmdAbl
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Dark first (matches the palette UI in Live); the toggle switches to light.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/cmdabl.css

# Only the guides are published for now. Everything else under docs/ stays repo-only
# (docs/sdk-tree.md summarizes Ableton's SDK and is not for a public site).
exclude_docs: |
  sdk-tree.md
  feature-plans/

nav:
  - Home: index.md
  - Guides:
      - Overview: guides/README.md
      - Releasing cmdAbl: guides/release-cmdabl.md
      - pakabl index: guides/pakabl-index.md
      - CI: guides/ci.md

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
