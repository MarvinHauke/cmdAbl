site_name: cmdAbl
site_description: A command palette for Ableton Live
site_url: https://marvinhauke.github.io/cmdAbl/
repo_url: https://github.com/MarvinHauke/cmdAbl
repo_name: MarvinHauke/cmdAbl
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Dark first (matches the palette UI in Live); the toggle switches to light.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/cmdabl.css

# Pages that stay in the repository and are not part of the site: the SDK summary (not for a public
# site), the plans, and the maintainer guides (releasing, CI and secrets, the pakabl index).
exclude_docs: |
  sdk-tree.md
  feature-plans/
  guides/README.md
  guides/release-cmdabl.md
  guides/ci.md
  guides/pakabl-index.md

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Using cmdAbl: using.md
  - Remote Script: remote-script.md
  - Commands: reference/commands.md
  - Known limits: limits.md
  - List your extension in pakabl: pakabl-listing.md
  - Develop:
      - Overview: develop.md
      - Architecture: architecture.md
      - Writing a command: guides/command-authoring.md
      - Remote Script protocol: reference/remote-script.md
      - Live API mapping: reference/live-api.md

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
