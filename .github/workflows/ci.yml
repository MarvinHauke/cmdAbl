name: CI

# Builds and packages cmdAbl on every PR and on pushes to features/main, and keeps the
# .ablx as a downloadable run artifact. Never publishes a release or bumps a version —
# releasing stays with package-release.yml (only when package.json's version is new).

on:
  pull_request:
  push:
    branches: [features, main]
  schedule:
    - cron: "23 5 * * 1" # weekly, to catch dependency drift
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check package.json and manifest.json versions match
        run: |
          pkg="$(node -p "require('./package.json').version")"
          man="$(node -p "require('./manifest.json').version")"
          if [ "$pkg" != "$man" ]; then
            echo "::error::package.json ($pkg) and manifest.json ($man) versions differ — bump both."
            exit 1
          fi

      - run: npm ci
      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: cmdabl-ablx
          path: "*.ablx"
          if-no-files-found: error
