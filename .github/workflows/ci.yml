name: CI

# Builds and packages cmdAbl on every PR and on pushes to features/main, and keeps the
# .ablx as a downloadable run artifact. Never publishes a release or bumps a version —
# releasing stays with package-release.yml (only when package.json's version is new).

on:
  pull_request:
  push:
    branches: [features, main]
  schedule:
    - cron: "23 5 * * 1" # weekly, to catch dependency drift
  workflow_dispatch:

jobs:
  # Needs no SDK, so it also runs for pull requests from forks (which get no secrets).
  script-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # -B: no __pycache__ files left behind in the working tree.
      - name: Remote Script tests (Python, standard library only)
        run: python3 -B -m unittest discover -s tests/remote-script

  build:
    runs-on: ubuntu-24.04
    env:
      HAS_VENDOR_TOKEN: ${{ secrets.VENDOR_TOKEN != '' }}
    steps:
      # The Ableton SDK may not be published, so it comes from a private repo through a secret.
      # GitHub gives pull requests from forks no secrets: say so plainly instead of failing later.
      - name: SDK access
        if: env.HAS_VENDOR_TOKEN != 'true'
        run: |
          echo "::error::This check needs the private Ableton SDK, which pull requests from forks cannot reach. A maintainer runs it from a branch in the main repository before merging (see docs/guides/ci.md)."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check package.json and manifest.json versions match
        run: |
          pkg="$(node -p "require('./package.json').version")"
          man="$(node -p "require('./manifest.json').version")"
          if [ "$pkg" != "$man" ]; then
            echo "::error::package.json ($pkg) and manifest.json ($man) versions differ — bump both."
            exit 1
          fi

      - name: Ableton SDK from the private vendor repo (license forbids public distribution)
        uses: actions/checkout@v4
        with:
          repository: MarvinHauke/cmdabl-vendor
          token: ${{ secrets.VENDOR_TOKEN }}
          path: vendor
          persist-credentials: false
      - run: npm ci
      - run: npm test

      # The command and Remote Script reference pages are generated from the code:
      # a committed page that differs (or a command without an example) fails here.
      - name: Reference pages are up to date
        run: npm run docs:reference -- --check

      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: cmdabl-ablx
          path: "*.ablx"
          if-no-files-found: error
