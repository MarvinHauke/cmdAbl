name: Secret scan

# Fails a pull request or push that adds a secret-shaped string in any of its
# commits (not only in the final tree). Runs gitleaks over the commit range
# being added; the weekly and manual runs scan the whole history.
# See docs/guides/ci.md. Needs no secrets: the default GITHUB_TOKEN with
# read-only contents is only used by checkout.

on:
  pull_request:
  push:
    branches: ["**"]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # gitleaks is MIT-licensed. The binary is pinned to an exact version and its
  # SHA-256 is checked below (hash of gitleaks_8.30.1_linux_x64.tar.gz from the
  # release's checksums file). Bump both together.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the commits being added
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT" = "push" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # An existing ref: the commits it gained. (A force-push may have
            # dropped $PUSH_BEFORE; then fall back to the whole history.)
            if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              range="${PUSH_BEFORE}..${PUSH_AFTER}"
            fi
          fi
          args=(git --config .gitleaks.toml --redact --no-banner --verbose)
          if [ -n "$range" ]; then
            echo "Scanning commit range $range"
            args+=(--log-opts="$range")
          else
            echo "Scanning the whole history"
          fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .
